var fsWrapping=false;
function fsWrapWords(root){
  if(!root||fsWrapping||typeof document.createTreeWalker!=='function')return;
  fsWrapping=true;
  try{
    var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
      if(!/[A-Za-z]{2,}/.test(n.nodeValue))return NodeFilter.FILTER_REJECT;
      var p=n.parentElement; if(!p)return NodeFilter.FILTER_REJECT;
      if(p.closest('button,.opt,.chip,.built,select,textarea,input,.fs-w,.fs-pop,#exBuilt,#repBar,script,style'))return NodeFilter.FILTER_REJECT;
      if(!p.closest('.en,.line,#fsHintBox,.fs-explain,.fs-first'))return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }});
    var nodes=[]; while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(function(n){
      var frag=document.createDocumentFragment();
      n.nodeValue.split(/([A-Za-z][A-Za-z'’-]*)/g).forEach(function(part){
        if(/^[A-Za-z][A-Za-z'’-]*$/.test(part)&&part.length>=2){var s=document.createElement('span');s.className='fs-w';s.textContent=part;frag.appendChild(s);}
        else frag.appendChild(document.createTextNode(part));
      });
      if(n.parentNode)n.parentNode.replaceChild(frag,n);
    });
  }catch(e){}
  fsWrapping=false;
}

function storyRender(){const st=_story,node=st.s.nodes[st.n];document.getElementById("storyBox").innerHTML='<div class="card"><p class="en" style="font-size:24px">'+esc(node.en)+'</p><p class="muted">'+esc(node.ar)+'</p><button onclick="speak(\''+esc(node.en).replace(/'/g,"\\'")+'\')">🔊 اسمع المشهد</button><div style="margin-top:10px">'+node.ch.map((c,i)=>'<button class="opt" style="display:block;width:100%;text-align:right" onclick="storyPick('+i+')">'+esc(c[1])+'<br><span class="en" style="font-size:19px">'+esc(c[0])+'</span></button>').join("")+'</div></div>';setTimeout(()=>speak(node.en),300)}
function storyPick(i){const st=_story,node=st.s.nodes[st.n],c=node.ch[i];st.total++;st.good+=(c[3]?1:0);if(node.end||c[2]===-1){const pct=st.total?Math.round(100*st.good/st.total):0;document.getElementById("storyBox").innerHTML='<div class="center"><div style="font-size:52px">📖</div><h3>نهاية القصة!</h3><p class="score">اختياراتك الطيبة: '+st.good+' من '+st.total+' ('+pct+'٪)</p><p class="muted">'+(pct>=80?"نهاية مشرقة — كلماتك كانت لطيفة وصحيحة! 🌟":pct>=50?"نهاية طيبة — أعد القصة وجرّب اختيارات ألطف.":"أعد القصة: اختر الردود اللطيفة والدقيقة دائمًا.")+'</p><button class="big" onclick="goStories()">قصص أخرى</button><button class="big" onclick="goLab()">المختبر ←</button></div>';labDone("story",20,"أكملت قصة تفاعلية");if(pct>=80)confetti();return}st.n=c[2];storyRender()}
/* --- تحدي نطق اليوم --- */
let _pron=null;
function goPron(){const seed=labSeed(todayStr());const words=labPick(labShortTerms(),5,seed);_pron={words:words,pass:{}};$app.innerHTML=labHead("🎙️ تحدي نطق كلمات اليوم")+'<div class="card"><p class="muted">طريقة ELSA بثلاث تمريرات: اسمع ← كرّر مع التكرار ← انطق في الميكروفون. كلمات اليوم تتغير كل يوم.</p>'+words.map((w,i)=>'<div class="line"><span class="en" style="font-size:24px;font-weight:bold">'+esc(w.en)+'</span> — '+esc(w.ar)+'<br><button onclick="speak(\''+esc(w.en).replace(/'/g,"\\'")+'\')">🔊 اسمع</button> <button onclick="if(typeof startRepeat===\'function\')startRepeat(\''+esc(w.en).replace(/'/g,"\\'")+'\')">🔁 كرّر ×'+(typeof vset!=="undefined"?vset.rep:3)+'</button> <button onclick="pronMic('+i+')">🎙️ انطقها</button> <span id="pronFb'+i+'"></span></div>').join("")+'<div id="pronDone"></div></div>'}
function pronMic(i){const w=_pron.words[i];const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const fb=document.getElementById("pronFb"+i);if(!SR){fb.innerHTML=' — <span class="muted">الميكروفون غير متاح هنا؛ كرّر بصوت عالٍ ثم اضغط: </span><button class="alt" onclick="pronSelf('+i+')">نطقتها صح ✅</button>';return}
try{const r=new SR();r.lang="en-US";r.interimResults=false;r.maxAlternatives=1;fb.textContent=" — 🎙️ اسمعك الآن… انطق!";r.onresult=function(ev){const heard=ev.results[0][0].transcript.toLowerCase().replace(/[^a-z ]/g,"").trim();const target=w.en.toLowerCase().replace(/[^a-z ]/g,"").trim();const ok=heard===target||heard.indexOf(target)>=0||target.indexOf(heard)>=0&&heard.length>2;fb.innerHTML=" — سمعتك تقول: <b class='en'>"+esc(heard)+"</b> "+(ok?"✅ أحسنت!":"❌ حاول مرة أخرى ببطء");if(ok)pronSelf(i,1)};r.onerror=function(){fb.innerHTML=' — <span class="muted">لم يعمل الميكروفون؛ </span><button class="alt" onclick="pronSelf('+i+')">نطقتها صح بنفسي ✅</button>'};r.start()}catch(e){fb.innerHTML=' — <button class="alt" onclick="pronSelf('+i+')">نطقتها صح بنفسي ✅</button>'}}
function pronSelf(i,silent){_pron.pass[i]=1;const fb=document.getElementById("pronFb"+i);if(fb&&!silent)fb.innerHTML=" — ✅ سجّلت نجاحك!";if(Object.keys(_pron.pass).length>=_pron.words.length){document.getElementById("pronDone").innerHTML='<div class="fb ok">🏆 أكملت تحدي نطق اليوم كله!</div>';labDone("pron",20,"أكملت تحدي نطق اليوم");confetti()}}
/* --- ضع الكلمة في جملتها (Cloze + توقّع) --- */
let _clz=null;
function goCloze(){const pool=labShortTerms().filter(t=>t.ex&&t.ex.toLowerCase().indexOf(t.en.toLowerCase().split(" ")[0])>=0);const w=pool[Math.floor(Math.random()*pool.length)];const base=w.en.split(" ")[0];const rx=new RegExp(base.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i");const sent=w.ex.replace(rx,"_____");const others=labPick(pool.filter(x=>x!==w),3,Date.now()&0xffff);_clz={w:w,sent:sent,opts:labPick(others.concat([w]),4,(Date.now()>>3)&0xffff)};
$app.innerHTML=labHead("✏️ ضع الكلمة في جملتها")+'<div class="card"><p class="en" style="font-size:24px">'+esc(sent)+'</p><p class="muted">'+esc(w.exAr||"")+'</p><p>🤔 <b>خطوة التوقّع:</b> قبل رؤية الخيارات، حاول تذكّر الكلمة الناقصة من ذاكرتك وقُلها بصوت عالٍ.</p><div id="clzBox"><button class="big" onclick="clzShow()">تذكّرت — أظهر الخيارات</button></div></div>'}
function clzShow(){document.getElementById("clzBox").innerHTML=_clz.opts.map((o,i)=>'<button class="opt en" onclick="clzPick('+i+')">'+esc(o.en)+'</button>').join("")}
function clzPick(i){const o=_clz.opts[i],ok=o===_clz.w;if(ok){labDone("cloze",10,"أكملت جملة بسياقها");speak(_clz.w.ex)}else{srsAdd(_clz.w.en,_clz.w.ar,"cloze")}document.getElementById("clzBox").innerHTML='<div class="fb '+(ok?"ok":"bad")+'">'+(ok?"✅ صح! ":"❌ الكلمة الصحيحة: "+esc(_clz.w.en)+" — "+esc(_clz.w.ar))+'<br><span class="en">'+esc(_clz.w.ex)+'</span></div><button class="big" onclick="goCloze()">جملة أخرى ✏️</button>'}
/* --- صح أم خطأ سريع --- */
let _tf=null,_tfTimer=null;
function goTF(){_tf={score:0,left:30,cur:null};clearInterval(_tfTimer);$app.innerHTML=labHead("⚖️ صح أم خطأ — ٣٠ ثانية")+'<div id="tfBox"></div>';_tfTimer=setInterval(()=>{if(!_tf)return clearInterval(_tfTimer);_tf.left--;const e=document.getElementById("tfTime");if(e)e.textContent=_tf.left;if(_tf.left<=0){clearInterval(_tfTimer);tfFinish()}},1000);tfNext()}
function tfNext(){const pool=labShortTerms();const w=pool[Math.floor(Math.random()*pool.length)];const truth=Math.random()<0.5;const shown=truth?w:pool[Math.floor(Math.random()*pool.length)];_tf.cur={w:w,isTrue:(shown.ar===w.ar)};
document.getElementById("tfBox").innerHTML='<div class="card center"><p>⏱️ <b id="tfTime">'+_tf.left+'</b> ث · نقاطك: <b>'+_tf.score+'</b></p><p class="en" style="font-size:30px;font-weight:bold">'+esc(w.en)+'</p><p style="font-size:24px">= '+esc(shown.ar)+' ؟</p><button class="big" onclick="tfAnswer(true)">✅ صح</button><button class="big" style="background:#b3261e;border-color:#b3261e" onclick="tfAnswer(false)">❌ خطأ</button><div id="tfFb"></div></div>'}
function tfAnswer(a){const c=_tf.cur;if(a===c.isTrue){_tf.score++;addXP(2,"صح أم خطأ")}else{srsAdd(c.w.en,c.w.ar,"tf")}tfNext()}
function tfFinish(){const s=_tf?_tf.score:0;_tf=null;$app.innerHTML=labHead("⚖️ صح أم خطأ")+'<div class="center"><div style="font-size:52px">⚖️</div><p class="score">نتيجتك: '+s+' إجابة صحيحة في ٣٠ ثانية</p><button class="big" onclick="goTF()">العب مجددًا</button><button class="big" onclick="goLab()">المختبر ←</button></div>';labDone("tf",12,"لعبت صح أم خطأ");if(s>=10)confetti()}
/* --- أكمل الحوار --- */
const LAB_DLG=[{ctx:"عند بوابة الموقع صباحًا",before:[["Guard","Good morning! Your ID, please."]],opts:["Here it is. Good morning!","I don't have time.","Where is the office?"],good:0,ar:"الرد الطبيعي: تُظهر البطاقة وترد التحية."},{ctx:"زميلك يعرض قهوة",before:[["Ahmed","Would you like some coffee?"]],opts:["No, go away.","Yes, please. Thank you!","Coffee is hot."],good:1,ar:"قبول مهذّب مع شكر — هكذا تُبنى العلاقات."},{ctx:"المشرف يسأل عن التقرير",before:[["Supervisor","Is the report ready?"]],opts:["Almost. I will finish it by noon.","Report what report?","Maybe tomorrow, maybe not."],good:0,ar:"إجابة مهنية: حالة واضحة + موعد محدد."},{ctx:"في الاجتماع، لم تفهم نقطة",before:[["Manager","We start the new plan on Sunday."]],opts:["Say nothing and guess later.","Sorry, could you repeat that, please?","This plan is bad."],good:1,ar:"طلب التكرار بأدب قوة لا ضعف."},{ctx:"زائر يطلب الاتجاهات",before:[["Visitor","Excuse me, where is the prayer room?"]],opts:["I don't know anything.","Go straight, then turn left. It is near the gate.","Why do you ask me?"],good:1,ar:"اتجاهات واضحة بترتيب بسيط."},{ctx:"نهاية يوم العمل",before:[["Colleague","See you tomorrow, in shaa Allah."]],opts:["Okay.","In shaa Allah. Have a good evening!","Tomorrow is far."],good:1,ar:"رد دافئ يكمل التحية بنفس روحها."}];
let _dlg=null;
function goDlg(){_dlg=LAB_DLG[Math.floor(Math.random()*LAB_DLG.length)];$app.innerHTML=labHead("💬 أكمل الحوار")+'<div class="card"><p class="muted">الموقف: '+esc(_dlg.ctx)+'</p>'+_dlg.before.map(l=>'<div class="bub bubBot"><span class="who">'+esc(l[0])+':</span> <span class="en">'+esc(l[1])+'</span></div>').join("")+'<p>دورك الآن — اختر الرد الطبيعي:</p><div id="dlgBox">'+labPick(_dlg.opts.map((o,i)=>({o:o,i:i})),3,Date.now()&0xffff).map(x=>'<button class="opt en" style="display:block;width:100%;text-align:left" onclick="dlgPick('+x.i+')">'+esc(x.o)+'</button>').join("")+'</div></div>'}
function dlgPick(i){const ok=i===_dlg.good;if(ok){labDone("dlg",10,"أكملت حوارًا");speak(_dlg.opts[i])}else{srsAdd(_dlg.opts[_dlg.good],_dlg.ar,"dlg")}document.getElementById("dlgBox").innerHTML='<div class="fb '+(ok?"ok":"bad")+'">'+(ok?"✅ رد طبيعي! ":"❌ الرد الأفضل: "+esc(_dlg.opts[_dlg.good])+" ")+'<br>💡 '+esc(_dlg.ar)+'</div><button class="big" onclick="goDlg()">حوار آخر 💬</button>'}
/* --- ربط بالرئيسية والألعاب --- */
(function(){const _gh=goHome;goHome=function(){_gh();try{labToday();labFreezeGuard();const t=labToday(),qs=labQuests(),qd=qs.filter(q=>t.quests[q.id]).length;const main=$app.querySelector(".desk2-main")||$app;const d=document.createElement("div");d.innerHTML='<button class="big" style="background:#2e7d32;border-color:#2e7d32" onclick="goLab()">🧪 مختبر الأنشطة — مهام اليوم: '+qd+'/٣'+(t.box?" · 🎁 فُتح صندوق اليوم":" · 🎁 صندوق مفاجأة بانتظارك")+'</button>';main.insertBefore(d,main.firstChild)}catch(e){}};
try{goHome()}catch(e){}
const _gg=goGames;goGames=function(){_gg();try{const g=$app.querySelector(".grid");if(g)g.insertAdjacentHTML("beforeend",'<div class="card"><h3>🧪 مختبر الأنشطة الجديد</h3><p class="muted">بطاقات قابلة للقلب، ترتيب كلمات، تصحيح جمل، قصص تفاعلية، مطابقة ضد الساعة، مهام يومية وصندوق مفاجآت.</p><button class="big" onclick="goLab()">ادخل المختبر 🧪</button></div>')}catch(e){}}})();

</script>
<style>

<script>
/* ===== ⭐ بنك الكلمات المحفوظة + 🪜 سلّم الرحلة + 📊 التحليل والفيدباك + 🩺 الخطة العلاجية — إضافة ٢٧ نوفمبر ٢٠٢٦ =====
   كل البيانات داخل esp2_progress نفسه (savedWords / skillStats / counters / trackTouch / remedial) فتدخل التصدير والاستيراد تلقائيًا. */
(function(){
'use strict';
var SKILL_NAMES={listening:'الاستماع',speaking:'التحدث والنطق',vocab:'المفردات',grammar:'القواعد'};
var SW_LADDER=[25,50,100,200,400];
var SW_FILTER='all', SW_VIEW=[], SW_REV=null, SW_CUR='home', SW_CELEB_Q=[];
var SWCTX={track:'',level:'',src:''};
function swSave(){ try{ saveProgress(); }catch(e){} }
function swDateStr(off){ var d=new Date(); d.setDate(d.getDate()+(off||0)); return d.toISOString().slice(0,10); }
function swNorm(w){ return String(w||'').trim().toLowerCase(); }
function swCounts(){ var a=(progress&&progress.savedWords)||[]; var kn=0; for(var i=0;i<a.length;i++) if(a[i].known) kn++; return {total:a.length, known:kn, hard:a.length-kn, mastered:(typeof mastered!=='undefined'&&mastered)?mastered.length:0}; }
function swFind(w){ var k=swNorm(w); var a=progress.savedWords; for(var i=0;i<a.length;i++) if(swNorm(a[i].w)===k) return i; return -1; }
function swIsSaved(w){ return swFind(w)>=0; }
function swCtx(){ var h=''; try{ var el=document.querySelector('#app h2'); if(el) h=el.textContent.trim().slice(0,60); }catch(e){} return {track:SWCTX.track||'', level:SWCTX.level||'', src:SWCTX.src||h||'عام'}; }
function swSaveWord(w,m,ctx){ w=String(w||'').trim(); if(!w) return; var c=ctx||swCtx(); var i=swFind(w);
  if(i>=0){ var x=progress.savedWords[i]; if(m) x.m=m; x.track=c.track||x.track||''; x.level=c.level||x.level||''; if(c.src) x.src=c.src; }
  else progress.savedWords.push({w:w, m:m||'', track:c.track||'', level:c.level||'', src:c.src||'عام', ts:Date.now(), known:false});
  swSave(); swCheckMilestones(); }
function swRemoveWord(w){ var i=swFind(w); if(i>=0){ progress.savedWords.splice(i,1); swSave(); } }

/* ---------- التهيئة الآمنة للتقدم القائم ---------- */
function swInit(){
  if(typeof progress==='undefined'||!progress) return false;
  if(!Array.isArray(progress.savedWords)) progress.savedWords=[];
  progress.skillStats=progress.skillStats||{};
  ['listening','speaking','vocab','grammar'].forEach(function(k){ var v=progress.skillStats[k]; if(!v||typeof v.ok!=='number'||typeof v.total!=='number') progress.skillStats[k]={ok:(v&&v.ok)||0,total:(v&&v.total)||0}; });
  progress.counters=progress.counters||{};
  if(!Array.isArray(progress.counters.celebrated)) progress.counters.celebrated=[];
  if(!progress.counters.lastReportTs) progress.counters.lastReportTs=Date.now();
  if(!progress.trackTouch) progress.trackTouch={};
  var now=Date.now();
  try{ SECTIONS.forEach(function(sec){ if(progress.trackTouch[sec.id]==null){ var st=trackStats(sec.id); progress.trackTouch[sec.id]= st.done>0? now : 0; } }); }catch(e){}
  var last=progress.counters.lastSessionTs||0;
  progress.counters.gapDays= last? Math.floor((now-last)/864e5) : 0;
  progress.counters.lastSessionTs=now;
  if(!('remedial' in progress)) progress.remedial=null;
  swSave();
  return true;
}

/* ---------- الاحتفالات بالإنجازات (تُطلق مرة واحدة) ---------- */
function swCelebrate(key,msg){ if(progress.counters.celebrated.indexOf(key)>=0) return; progress.counters.celebrated.push(key); swSave(); try{ confetti(); }catch(e){} SW_CELEB_Q.push(msg); if(!document.getElementById('swCeleb')) swCelebNext(); }
function swCelebNext(){ var msg=SW_CELEB_Q.shift(); if(!msg) return; var d=document.createElement('div'); d.id='swCeleb'; d.className='sw-celeb'; d.setAttribute('dir','rtl');
  d.innerHTML='<div class="sw-celeb-card"><div style="font-size:52px">🎉🏆</div><h3>إنجاز جديد يا بطل!</h3><p style="font-size:18px">'+esc(msg)+'</p><button type="button" class="big" onclick="swCelebClose()">برافو عليّا 💪 كمّل</button></div>'; document.body.appendChild(d); }
window.swCelebClose=function(){ var d=document.getElementById('swCeleb'); if(d) d.remove(); swCelebNext(); };
function swCheckMilestones(){ var c=swCounts(); SW_LADDER.forEach(function(n){ if(c.total>=n) swCelebrate('saved'+n,'وصلت '+n+' كلمة محفوظة في بنك كلماتك ⭐ كل كلمة هنا هي خطوة ثابتة في رحلتك.'); if(c.mastered>=n) swCelebrate('mast'+n,'وصلت '+n+' عبارة أتقنتها بالنطق 🏆 صوتك بيقوى يوم بعد يوم.'); });
  var st=0; try{ st=streak(); }catch(e){} [7,14,30].forEach(function(n){ if(st>=n) swCelebrate('streak'+n,'سلسلة '+n+' يوم تعلّم متواصل 🔥 الاستمرارية دي هي سر الإتقان الحقيقي.'); }); }

/* ---------- نافذة القاموس (الضغط على أي كلمة): زر الحفظ ---------- */
function swCleanMean(t){ return String(t||'').replace(/^\s*—\s*/,'').replace(/\s*\([^)]*\)\s*$/,'').trim(); }
function swPopMeaning(p){ var m=p.querySelector('#fsPopMean'); if(m){ if(m.textContent.indexOf('⏳')>=0) return null; return swCleanMean(m.textContent); }
  var spans=p.querySelectorAll('span'); for(var i=0;i<spans.length;i++){ var t=spans[i].textContent||''; if(t.indexOf('—')===0) return swCleanMean(t); } return ''; }
function swPopToggle(p,b){ var w=p.dataset.word||''; if(!w) return;
  if(swIsSaved(w)){ swRemoveWord(w); b.textContent='⭐ احفظ الكلمة'; try{ toast('أُزيلت «'+w+'» من كلماتك المحفوظة'); }catch(e){} return; }
  var m=swPopMeaning(p);
  if(m===null){ var tries=0; var iv=setInterval(function(){ tries++; var mm=swPopMeaning(p); if(mm!==null||tries>12){ clearInterval(iv); swSaveWord(w,mm||''); b.textContent='★ محفوظة — إزالة'; try{ toast('⭐ حُفظت «'+w+'» في كلماتك المحفوظة'); }catch(e){} } },300); return; }
  swSaveWord(w,m); b.textContent='★ محفوظة — إزالة'; try{ toast('⭐ حُفظت «'+w+'» في كلماتك المحفوظة'); }catch(e){} }
function swPopBtn(p){ if(!p||p.querySelector('.sw-pop-save')) return; var w=p.dataset.word||''; var b=document.createElement('button'); b.type='button'; b.className='alt sw-pop-save';
  b.textContent= swIsSaved(w)? '★ محفوظة — إزالة' : '⭐ احفظ الكلمة';
  b.onclick=function(){ swPopToggle(p,b); };
  var gh=p.querySelector('.ghost'); if(gh) p.insertBefore(b,gh); else p.appendChild(b); }

/* ---------- نجوم الحفظ في ملخص المصطلحات وبطاقات المختبر ---------- */
function swStarBtn(labelSaved,onclick){ var b=document.createElement('button'); b.type='button'; b.className='ghost sw-star'; b.textContent=labelSaved?'★':'☆'; b.title='احفظ في كلماتي المحفوظة'; b.onclick=onclick; return b; }
function swInjectGlossStars(sec){ var rows=document.querySelectorAll('#app table tr');
  rows.forEach(function(row){ if(row.querySelector('th')) return; var cells=row.querySelectorAll('td'); if(cells.length<3) return;
    var term=cells[0].textContent.trim(); var mean=cells[2].textContent.trim(); if(!term) return; var last=cells[cells.length-1]; if(last.querySelector('.sw-star')) return;
    var b=swStarBtn(swIsSaved(term),function(){ if(swIsSaved(term)){ swRemoveWord(term); b.textContent='☆'; try{ toast('أُزيلت «'+term+'»'); }catch(e){} } else { swSaveWord(term,mean,{track:sec,level:'',src:'ملخص مصطلحات'}); b.textContent='★'; try{ toast('⭐ حُفظت «'+term+'» في كلماتك'); }catch(e){} } });

function swSkillNext(k,weakest){ var secId=weakest? weakest.sec.id : 'safety'; var title=secById(secId).title;

function swFeedback(){ var sts=SECTIONS.map(function(sec){ return {sec:sec, st:trackStats(sec.id)}; });

  started.forEach(function(x){ if(!strongest||x.st.pct>strongest.st.pct) strongest=x; if(!weakest||x.st.pct<weakest.st.pct) weakest=x; if(!focused||x.st.done>focused.st.done) focused=x; });
  var ss=progress.skillStats, worstSkill=null, bestSkill=null;

/* ---------- 🩺 الخطة العلاجية ---------- */
function swDiagnose(){ var out=[]; var c=progress.counters;
  if((c.gapDays||0)>=3) out.push({key:'inactive', kind:'return', reason:'بقالك '+c.gapDays+' أيام من غير جلسة — خطة رجوع هادية ترجعك للإيقاع بخطوات صغيرة ومن غير أي ضغط.'});
  var ss=progress.skillStats, worst=null;
  ['listening','speaking','vocab','grammar'].forEach(function(k){ var v=ss[k]; if(v&&v.total>=10){ var acc=v.ok/v.total; if(acc<0.6&&(!worst||acc<worst.acc)) worst={skill:k,acc:acc}; } });
  if(worst) out.push({key:'skill', kind:'skill', skill:worst.skill, reason:'مهارة «'+SKILL_NAMES[worst.skill]+'» دقتها '+Math.round(worst.acc*100)+'٪ بس — واقعة شوية ومحتاجة أسبوع تركيز خفيف.'});
  var sts=SECTIONS.map(function(sec){ return {sec:sec, st:trackStats(sec.id), touch:progress.trackTouch[sec.id]||0}; });
  var anyAdvance=sts.some(function(x){ return x.st.done>0&&x.touch&&(Date.now()-x.touch)<7*864e5; });
  var stalled=sts.filter(function(x){ return x.st.done>0&&!x.st.all&&x.touch&&(Date.now()-x.touch)>=7*864e5; });
  if(stalled.length&&anyAdvance) out.push({key:'stall', kind:'track', sec:stalled[0].sec.id, reason:'تخصص «'+stalled[0].sec.title+'» واقف من '+Math.floor((Date.now()-stalled[0].touch)/864e5)+' أيام بينما تخصصات تانية بتتقدم — نرجّعه للحركة بدروس صغيرة.'});

  if(p.kind==='track'&&b.sec){ var dn=trackStats(b.sec).done;

function swPlanTick(){ var p=progress.remedial; if(!p||p.status!=='active'||!p.days||!p.days.length) return;

function swRemedialHTML(){ swPlanTick(); var p=progress.remedial;

  if(p&&p.status==='done'){ return '<div class="card" style="border-color:#c9a227;background:#fffbe8"><h3>🩺 نتيجة خطتك العلاجية</h3><p>'+esc(p.verdict||'')+'</p><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="big" onclick="swGenPlan()">🔄 خطة جديدة</button><button class="ghost" onclick="swPlanClose()">خلاص، تمام</button></div></div>'; }
  var diags=swDiagnose();
  if(diags.length){ return '<div class="card" style="border-color:#c9a227;background:#fffbe8"><h3>🩺 خطة علاجية</h3><p><b>التشخيص:</b> '+esc(diags[0].reason)+'</p><p class="muted">أرسم لك خطة ٧ أيام — مهمتين أو تلاتة في اليوم (حوالي ١٥ دقيقة) بيستهدفوا النقطة دي بالذات من محتوى التطبيق نفسه.</p><button class="big" onclick="swGenPlan()">🩺 ارسم خطتي العلاجية</button></div>'; }
  return '<div class="card"><h3>🩺 خطة علاجية</h3><p>مفيش حاجة واقعة دلوقتي — مستواك متوازن 💪</p><p class="muted">'+esc(swWatchItem())+'</p></div>'; }

/* ---------- شاشة التحليل ---------- */

  var dueN=0; try{ dueN=srsDue().length; }catch(e){}
  var weekDays=0,totalDays=0,xp=0,st=0; try{ var sd7=swDateStr(-6); weekDays=game.days.filter(function(x){ return x>=sd7; }).length; totalDays=game.days.length; xp=game.xp||0; st=streak(); }catch(e){}
  var trackRows=fb.sts.map(function(x){ return '<div>• '+esc(x.sec.title)+': <b>'+x.st.done+'/'+x.st.total+'</b> وحدة ('+x.st.pct+'٪) — مستواك الحالي فيه '+x.st.cur+'</div>'; }).join('');
  var ss=progress.skillStats;

  var anySkill=Object.keys(ss).some(function(k){ return ss[k]&&ss[k].total>=10; });
  var strongTxt= fb.bestSkill? 'مهارة «'+SKILL_NAMES[fb.bestSkill.k]+'» ('+Math.round(fb.bestSkill.acc*100)+'٪)' : (fb.strongest? 'تخصص «'+fb.strongest.sec.title+'» ('+fb.strongest.st.pct+'٪ من وحداته)' : 'لسه في أول الطريق — كمّل دروسك وهتظهر قوتك هنا');

    + '<div class="card"><h3>🎯 مهاراتك (من إجاباتك الفعلية)</h3>'+skillRows+(anySkill? '' : '<p class="muted">إحصائيات المهارة بتتجمع من النهاردة — أكمل ١٠ محاولات في أي مهارة وهتظهر هنا أقوى وأضعف مهارة عندك بدقة.</p>')+'</div>'
    + '<div class="card"><h3>📈 نشاطك</h3><p>أيام نشاط الأسبوع ده: <b>'+weekDays+'</b> · كل أيام نشاطك: <b>'+totalDays+'</b> · سلسلة الأيام: <b>'+st+'</b> 🔥 · نقاط الخبرة: <b>'+xp+'</b> ⭐</p></div>'
    + swRemedialHTML();

/* ---------- حقن الرئيسية وربط الخطة اليومية ---------- */
function swHomeInject(){ var main=document.querySelector('#app .desk2-main'); if(!main||document.getElementById('swHomeBox')) return;

  if(Date.now()-(progress.counters.lastReportTs||0)>=7*864e5) html+=swReportHTML();
  html+='<div class="card"><h3>⭐ كلماتي المحفوظة وتحليلي</h3><p>📚 كلمات محفوظة: <b>'+c.total+'</b> · ✅ أتقنتها: <b>'+c.known+'</b> · 🔥 لسه صعبة: <b>'+c.hard+'</b><br>🏆 عبارات أتقنها التطبيق (بالنطق): <b>'+c.mastered+'</b></p><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="big" onclick="goSavedWords()">⭐ افتح كلماتي المحفوظة</button><button class="alt" onclick="goJourney()">🪜 سلّم رحلتي</button><button class="alt" onclick="goAnalytics()">📊 تحليلي وفيدباك</button></div></div>';
  var box=document.createElement('div'); box.id='swHomeBox'; box.innerHTML=html; main.insertBefore(box,main.firstChild); }

/* ---------- أدوات الربط (wrapping) دون لمس الأصل ---------- */
function swAfter(name,fn){ try{ if(typeof window[name]==='function'){ var o=window[name]; window[name]=function(){ var r=o.apply(this,arguments); try{ fn(o,arguments); }catch(e){} return r; }; } }catch(e){} }
function swStat(skill,ok){ try{ var v=progress.skillStats[skill]; if(!v) return; v.total++; if(ok) v.ok++; swSave(); }catch(e){} }

function swInstall(){
  /* سياق الحفظ: آخر تخصص/مستوى فُتح */

  swAfter('goScene',function(o,a){ SWCTX={track:a[0]||SWCTX.track,level:'',src:''}; });

  swAfter('flipRender',function(){ swInjectFlipStar(); });
  /* إحصائيات المهارات من نقاط التحقق الحقيقية */
  var compMark=null;

    try{ if(typeof compState!=='undefined'&&compState&&compState.qs){ if(!compMark||compMark.st!==compState||compMark.qi!==compState.qi){ compMark={st:compState,qi:compState.qi}; counted=true; ok=(e===compState.qs[compState.qi][2]); } } }catch(err){}
    var r=_ac.apply(this,arguments); if(counted) swStat('listening',ok); return r; }; } }catch(e){}
  try{ if(typeof window.answerChallenge==='function'){ var _ach=window.answerChallenge; window.answerChallenge=function(e){ var counted=false,ok=false;
    try{ if(typeof chState!=='undefined'&&chState&&!chState.answered){ counted=true; ok=(e===chState.items[chState.i].correct); } }catch(err){}
    var r=_ach.apply(this,arguments); if(counted) swStat('listening',ok); return r; }; } }catch(e){}
  try{ if(typeof window.grPick==='function'){ var _gp=window.grPick; window.grPick=function(i,j){ var counted=false,ok=false;
    try{ if(typeof grState!=='undefined'&&grState&&grState.ans&&grState.ans[i]==null){ counted=true; ok=(j===grState.g.practice[i].correct); } }catch(err){}
    var r=_gp.apply(this,arguments); if(counted) swStat('grammar',ok); return r; }; } }catch(e){}
  swAfter('shadowJudge',function(o,a){ swStat('speaking',!!a[0]); });
  swAfter('advJudge',function(o,a){ swStat('speaking',!!a[0]); });
  swAfter('pronSelf',function(){ swStat('speaking',true); });
  swAfter('flipKnow',function(o,a){ swStat('vocab',!!a[0]); });
  try{ if(typeof window.checkWords==='function'){ var _cw=window.checkWords; window.checkWords=function(){ var sz=-1;
    try{ if(typeof speakState!=='undefined'&&speakState&&speakState.passed) sz=speakState.passed.size; }catch(err){}
    var r=_cw.apply(this,arguments); var ok=false; try{ ok=(sz>=0&&speakState.passed.size>sz); }catch(err){} swStat('speaking',ok); return r; }; } }catch(e){}
  /* إنجازات + لمس التخصصات عند إتمام الوحدات */
  swAfter('addMastered',function(){ swCheckMilestones(); });
  try{ if(typeof window.completeUnit==='function'){ var _cu=window.completeUnit; window.completeUnit=function(id,xp){ var r=_cu.apply(this,arguments);
    try{ if(r){ for(var si=0;si<SECTIONS.length;si++){ for(var li=0;li<LEVELS.length;li++){ var us=trackUnitsFor(SECTIONS[si].id,LEVELS[li]); for(var ui=0;ui<us.length;ui++) if(us[ui].id===id){ progress.trackTouch[SECTIONS[si].id]=Date.now(); } } } swSave(); } }catch(err){}
    return r; }; } }catch(e){}
  /* الرئيسية + خطة اليوم */
  swAfter('goHome',function(){ SW_CUR='home'; swPlanTick(); swHomeInject(); swCheckMilestones(); });
  try{ if(typeof window.planHTML==='function'){ var _ph=window.planHTML; window.planHTML=function(){ var h=_ph.apply(this,arguments); try{ swPlanTick(); h+=swRemedialStripHTML(); }catch(e){} return h; }; } }catch(e){}
  /* مراقبة نافذة القاموس */
  try{ var mo=new MutationObserver(function(){ var p=document.getElementById('fsPop'); if(p) swPopBtn(p); }); mo.observe(document.body,{childList:true}); }catch(e){}

try{ if(swInit()){ swInstall(); try{ if(document.querySelector('#app .desk2-main')){ swPlanTick(); swHomeInject(); } }catch(e){} } }catch(e){}
})();

<script>
// ===== تحديث التطبيق بضغطة واحدة (v10) — زر «🔄 تحديث الآن» + كشف سلبي للنسخ الجديدة =====
(function(){
'use strict';
var RELOAD_FLAG='espUpdReloading', DONE_FLAG='espUpdDone';
var reg=null, updateReady=false, updating=false, reloading=false, banner=null;

function say(html){ try{ if(typeof toast==='function'){ toast(html); return; } }catch(e){}
  var t=document.createElement('div'); t.className='toast'; t.innerHTML=html; document.body.appendChild(t);
  setTimeout(function(){ t.classList.add('show'); },30);
  setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },400); },2600); }

function guardedReload(){
  if(reloading) return;
  try{ if(sessionStorage.getItem(RELOAD_FLAG)) return; sessionStorage.setItem(RELOAD_FLAG,'1'); sessionStorage.setItem(DONE_FLAG,'1'); }catch(e){}
  reloading=true; location.reload();
}

/* عند بدء التطبيق: لو رجعنا من تحديث ناجح، رحّب مرة واحدة ونظّف الأعلام */
try{
  if(sessionStorage.getItem(DONE_FLAG)){ sessionStorage.removeItem(DONE_FLAG); sessionStorage.removeItem(RELOAD_FLAG);
    setTimeout(function(){ say('تم التحديث لأحدث نسخة ✓'); },900);
  } else { sessionStorage.removeItem(RELOAD_FLAG); }
}catch(e){}

function showBanner(){
  if(banner||document.getElementById('espUpdBanner')) return;
  banner=document.createElement('div'); banner.id='espUpdBanner'; banner.setAttribute('dir','rtl');
  banner.style.cssText='position:fixed;top:0;right:0;left:0;z-index:10001;background:#0b7a3e;color:#fff;padding:10px 14px;box-shadow:0 3px 14px rgba(0,0,0,.3);display:flex;align-items:center;gap:10px;flex-wrap:wrap;';
  banner.innerHTML='<span style="flex:1;min-width:170px;font-size:19px">✨ فيه نسخة جديدة جاهزة</span>'
    +'<button type="button" style="background:#ffc21f;color:#0b3d66;border:2px solid #ffc21f;font-weight:bold" onclick="espDoUpdate()">🔄 حدّث الآن</button>'
    +'<button type="button" aria-label="إغلاق" style="background:transparent;color:#fff;border:2px solid #9fd8b4;padding:6px 12px" onclick="espUpdHideBanner()">✕</button>';
  document.body.appendChild(banner);
}
window.espUpdHideBanner=function(){ if(banner){ if(banner.parentNode) banner.parentNode.removeChild(banner); banner=null; } };

function markReady(){ updateReady=true; showBanner(); }

function trackWorker(w){
  if(!w) return;
  w.addEventListener('statechange',function(){
    if(w.state==='installed' && navigator.serviceWorker.controller) markReady();
    else if(w.state==='activated' && navigator.serviceWorker.controller) updateReady=true;
  });
}

function applyWorker(w){
  try{ w.postMessage({type:'SKIP_WAITING'}); }catch(e){}
  var tries=0;
  var iv=setInterval(function(){
    tries++;
    if(reloading){ clearInterval(iv); return; }
    if(w.state==='activated'||w.state==='activating'){ clearInterval(iv); guardedReload(); }
    else if(w.state==='redundant'){ clearInterval(iv); updating=false; say('التحديث ما كمّلش — جرّب تاني'); }
    else if(tries>15){ clearInterval(iv); updating=false; say('التحديث بياخد وقت — جرّب تاني كمان شوية'); }
  },700);
}

if('serviceWorker' in navigator){
  var hadController=!!navigator.serviceWorker.controller; /* وجود متحكّم عند الفتح = التطبيق مثبّت أصلًا؛ بدونه فأول controllerchange مجرد تفعيل أول تثبيت لا تحديث */
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(updating) guardedReload();
    else if(hadController) updateReady=true;
  });
}

window.espDoUpdate=function(){
  window.espUpdHideBanner();
  if(!('serviceWorker' in navigator) || !navigator.serviceWorker.controller){ location.reload(); return; }
  if(updateReady){ updating=true; guardedReload(); return; }
  if(updating) return;
  updating=true;
  say('🔄 بندوّر على تحديث…');
  navigator.serviceWorker.getRegistration().then(function(r){
    if(!r){ updating=false; location.reload(); return; }
    reg=r;
    if(r.waiting){ applyWorker(r.waiting); return; }
    var foundNew=false, applied=false;
    function watchNew(w){ if(!w) return; w.addEventListener('statechange',function(){
      if(!applied && (w.state==='installed'||w.state==='activating'||w.state==='activated')){ applied=true; applyWorker(w); } }); }
    function onFound(){ foundNew=true; watchNew(r.installing); }
    r.addEventListener('updatefound',onFound);
    r.update().then(function(){
      setTimeout(function(){
        r.removeEventListener('updatefound',onFound);
        if(applied) return;
        if(r.waiting){ applied=true; applyWorker(r.waiting); return; }
        if(r.installing){ watchNew(r.installing); return; }
        if(!foundNew){ updating=false; say('أنت على أحدث نسخة ✓'); }
      },800);
    }).catch(function(){ updating=false; say('أنت على أحدث نسخة ✓'); });
  }).catch(function(){ updating=false; location.reload(); });
};

/* كشف سلبي عند كل فتح: فحص تحديث + مراقبة أي عامل جديد — بلا إعادة تحميل تلقائية أبدًا */
function passiveCheck(){
  if(!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.getRegistration().then(function(r){

<script>

(function(){
