dashed #0b3d66;border-radius:10px;padding:8px;margin:8px 0;background:#fff;}select{font-size:20px;padding:8px;border-radius:8px;border:2px solid #0b3d66;font-family:inherit;}.muted{color:#444;font-size:18px;}.score{font-size:26px;font-weight:bold;text-align:center;}.prog{background:#e3ecf2;border-radius:10px;height:18px;overflow:hidden;margin:8px 0;}.prog>div{background:#2e7d32;height:100%;}table{width:100%;border-collapse:collapse;font-size:19px;}td,th{border:1px solid #b9cdd9;padding:8px;vertical-align:top;}th{background:#eef4f8;}.note{background:#fff6da;border:2px solid #a67c00;border-radius:10px;padding:10px 14px;}.center{text-align:center;}.mic-on{background:#b3261e !important;border-color:#b3261e !important;}.bub{border-radius:12px;padding:10px 14px;margin:8px 0;max-width:92%;}.bubBot{background:#eef4f8;border:2px solid #9db8cc;margin-left:auto;}.bubMe{background:#e2f4e2;border:2px solid #2e7d32;margin-right:auto;}.bubNote{background:#fff6da;border:2px solid #a67c00;max-width:100%;}.chatlog{padding:4px 0;}.txtin{font-family:inherit;font-size:20px;padding:12px;border-radius:10px;border:2px solid #0b3d66;flex:1;min-width:220px;width:100%;}textarea.txtin{flex:none;}.taskrow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:2px solid #b9cdd9;border-radius:10px;padding:8px 12px;margin:6px 0;flex-wrap:wrap;}.vidwrap{position:relative;padding-top:56.25%;}.vidwrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;border-radius:10px;}audio{max-width:100%;}input[type=range]{width:100%;accent-color:#0b3d66;height:38px;cursor:pointer;}#repBar{position:fixed;right:0;left:0;bottom:0;z-index:9998;background:#0b3d66;color:#fff;padding:8px 10px;box-shadow:0 -3px 14px rgba(0,0,0,.35);display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:17px;}#repBar button{font-size:17px;padding:7px 12px;margin:0;background:#fff;color:#0b3d66;border:2px solid #fff;border-radius:10px;cursor:pointer;}#repBar button.stop{background:#b3261e;border-color:#b3261e;color:#fff;font-weight:bold;}#repBar select{font-size:17px;padding:5px;border-radius:8px;}body{padding-bottom:124px;}@media (min-width:1024px){body{padding-bottom:72px;}main{max-width:1180px;padding:22px 28px;}.grid{grid-template-columns:1fr 1fr 1fr;}.desk2{display:flex;gap:18px;align-items:flex-start;}.desk2-side{flex:0 0 350px;position:sticky;top:14px;max-height:calc(100vh - 30px);overflow:auto;}.desk2-main{flex:1;min-width:0;}.bub{max-width:76%;}.chatlog{max-width:940px;margin:0 auto;}.card.voiceset{grid-column:span 2;}button{padding:13px 24px;}.opt{padding:14px;}}@media (min-width:1440px){main{max-width:1340px;}}</style>

<script>const SECTIONS=[{id:"safety",icon:"⛑️",title:"إنجليزي السلامة",sub:"Safety English — لاجتماعات السلامة والتفتيش والتواصل في الموقع",terms:[["Personal Protective Equipment (PPE)","بيرسونال بروتيكتيف إكويبمنت","معدات الوقاية الشخصية","You must wear your PPE before entering the site.","يجب أن ترتدي معدات الوقاية الشخصية قبل دخول الموقع."],["Hazard","هازارد","خطر / مصدر خطر","Report any hazard to your supervisor immediately.","أبلغ مشرفك فورًا عن أي مصدر خطر."],["Risk","ريسك","احتمالية وشدة الضرر","We must assess the risk before starting the job.","يجب أن نقدّر المخاطر قبل بدء العمل."],["Risk Assessment","ريسك أسيسمنت","تقييم المخاطر","The risk assessment must be approved before work starts.","يجب اعتماد تقييم المخاطر قبل بدء العمل."],["Permit to Work","بيرميت تو وورك","تصريح عمل","Hot work requires a permit to work.","الأعمال الساخنة تتطلب تصريح عمل."],["Toolbox Talk","تولبوكس توك","اجتماع سلامة قصير قبل العمل","We start every shift with a toolbox talk.","نبدأ كل وردية باجتماع سلامة قصير."],["Incident","إنسيدنت","حادث / واقعة","Every incident must be reported, even if nobody is hurt.","يجب الإبلاغ عن كل واقعة، حتى لو لم يُصب أحد."],["Near Miss","نير ميس","حادث وشيك (كاد يقع)","A near miss is a warning we must learn from.","الحادث الوشيك تحذير يجب أن نتعلم منه."],["Safety Inspection","سيفتي إنسبيكشن","تفتيش سلامة","The safety inspection is scheduled for Monday.","تفتيش السلامة مجدول يوم الاثنين."],["Safety Officer","سيفتي أوفيسر","مسؤول / مهندس السلامة","The safety officer stopped the unsafe work.","أوقف مسؤول السلامة العمل غير الآمن."],["Hard Hat","هارد هات","خوذة السلامة","Hard hats are mandatory in this area.","الخوذات إلزامية في هذه المنطقة."],["Safety Harness","سيفتي هارنيس","حزام أمان للعمل على ارتفاع","Check your safety harness before you climb.","افحص حزام الأمان قبل أن تصعد."],["Scaffolding","سكافولدينج","سقالات","Only trained workers may erect scaffolding.","لا يجوز تركيب السقالات إلا لعمال مدرّبين."],["Lockout / Tagout (LOTO)","لوك آوت / تاج آوت","عزل الطاقة ووضع البطاقات","Apply lockout/tagout before maintaining the machine.","طبّق عزل الطاقة قبل صيانة الماكينة."],["Emergency Evacuation","إميرجنسي إيفاكيويشن","إخلاء طارئ","During the emergency evacuation, go to the assembly point.","أثناء الإخلاء الطارئ، توجّه إلى نقطة التجمع."],["Assembly Point","أسيمبلي بوينت","نقطة التجمع","The assembly point is near the main gate.","نقطة التجمع قرب البوابة الرئيسية."],["Fire Extinguisher","فاير إكستينجويشر","طفاية حريق","Do you know where the nearest fire extinguisher is?","هل تعرف أين أقرب طفاية حريق؟"],["First Aid","فيرست إيد","إسعافات أولية","The first aid box is in the site office.","صندوق الإسعافات الأولية في مكتب الموقع."],["Confined Space","كونفايند سبيس","مكان مغلق / محصور","Never enter a confined space without a permit.","لا تدخل مكانًا محصورًا أبدًا دون تصريح."],["Work at Height","وورك أت هايت","العمل على ارتفاع","Work at height requires fall protection.","العمل على ارتفاع يتطلب حماية من السقوط."],["Fall Protection","فول بروتيكشن","الحماية من السقوط","Fall protection is required above two metres.","الحماية من السقوط مطلوبة فوق ارتفاع مترين."],["Safety Data Sheet (SDS)","سيفتي داتا شيت","نشرة بيانات سلامة المادة الكيميائية","Read the safety data sheet before using this chemical.","اقرأ نشرة بيانات السلامة قبل استخدام هذه المادة الكيميائية."],["Corrective Action","كوريكتيف أكشن","إجراء تصحيحي","We agreed on a corrective action to close the finding.","اتفقنا على إجراء تصحيحي لإغلاق الملاحظة."],["Unsafe Act","أنسيف آكت","تصرف غير آمن","Removing a machine guard is an unsafe act.","إزالة واقي الماكينة تصرّف غير آمن."],["Unsafe Condition","أنسيف كونديشن","حالة غير آمنة","Oil on the floor is an unsafe condition.","الزيت على الأرض حالة غير آمنة."],["Housekeeping","هاوس كيبينج","النظافة والترتيب في موقع العمل","Good housekeeping prevents many accidents.","الترتيب الجيد يمنع كثيرًا من الحوادث."],["Safety Glasses","سيفتي جلاسيز","نظارات سلامة","Wear safety glasses when you use the grinder.","ارتدِ نظارات السلامة عند استخدام الصاروخ."],["Ear Protection","إير بروتيكشن","واقيات الأذن","Ear protection is required in high-noise areas.","واقيات الأذن مطلوبة في مناطق الضوضاء العالية."],["Warning Sign","وورنينج ساين","لافتة تحذير","This warning sign means danger of falling objects.","لافتة التحذير هذه تعني خطر سقوط أجسام."],["Root Cause","روت كوز","السبب الجذري","We must find the root cause, not blame the worker.","يجب أن نجد السبب الجذري، لا أن نلوم العامل."],["Compliance","كومبلايانس","الالتزام / الامتثال","Compliance with safety rules is not optional.","الالتزام بقواعد السلامة ليس اختياريًا."],["Emergency Exit","إميرجنسي إيجزيت","مخرج طوارئ","Never block the emergency exit.","لا تسدّ مخرج الطوارئ أبدًا."]],phrases:[["Safety first.","السلامة أولًا."],["Please wear your helmet at all times on site.","من فضلك ارتدِ خوذتك طوال الوقت في الموقع."],["Stop the work immediately. This is unsafe.","أوقف العمل فورًا. هذا غير آمن."],["Report any hazard you see, please.","من فضلك أبلغ عن أي خطر تراه."],["We will start with a short toolbox talk.","سنبدأ باجتماع سلامة قصير."],["This job requires a permit to work.","هذا العمل يتطلب تصريح عمل."],["Do not enter this area without permission.","لا تدخل هذه المنطقة دون إذن."],["Check your harness before climbing.","افحص حزامك قبل الصعود."],["In case of emergency, go to the assembly point.","في حالة الطوارئ، توجّه إلى نقطة التجمع."],["Keep the walkway clear at all times.","حافظ على خلوّ الممر طوال الوقت."],["Report every incident, even a near miss.","أبلغ عن كل واقعة، حتى الحادث الوشيك."],["No smoking in this area.","ممنوع التدخين في هذه المنطقة."],["If you are not sure, ask your supervisor.","إذا لم تكن متأكدًا، اسأل مشرفك."],["Follow the lockout/tagout procedure before maintenance.","اتبع إجراء عزل الطاقة قبل الصيانة."],["Housekeeping is everyone's responsibility.","النظافة والترتيب مسؤولية الجميع."],["Thank you for working safely today.","شكرًا لكم على العمل بأمان اليوم."]],dialogues:[["اجتماع سلامة قصير (Toolbox Talk)",[["Safety Officer","Good morning, everyone. Let us talk about today's task.","صباح الخير جميعًا. لنتحدث عن مهمة اليوم."],["Worker","Good morning. What is the main hazard today?","صباح الخير. ما الخطر الرئيسي اليوم؟"],["Safety Officer","Today we work at height. Always tie off your harness.","اليوم نعمل على ارتفاع. اربطوا حزامكم دائمًا."],["Worker","Understood. And if the wind becomes strong?","مفهوم. وماذا لو اشتدّت الرياح؟"],["Safety Officer","Then we stop the work immediately. Safety first.","حينها نوقف العمل فورًا. السلامة أولًا."]]],["الإبلاغ عن خطر وإيقاف عمل غير آمن",[["Worker","Excuse me, sir. I saw a cable on the wet floor near the panel.","عفوًا يا سيدي. رأيت كابلًا على الأرض المبللة قرب اللوحة."],["Safety Officer","Thank you for reporting it. Please keep people away from the area.","شكرًا لإبلاغك. من فضلك أبعد الناس عن المنطقة."],["Worker","Should we stop the work there?","هل نوقف العمل هناك؟"],["Safety Officer","Yes, stop the work until the electrician fixes it. Good catch — this could have been a serious incident.","نعم، أوقفوا العمل حتى يصلحه الكهربائي. ملاحظة ممتازة — كان يمكن أن يتحول إلى حادث خطير."]]]]},{id:"business",icon:"💼",title:"إنجليزي الأعمال",sub:"Business English — للاجتماعات والمراسلات والعمل اليومي",terms:[["Meeting","ميتينج","اجتماع","We have a meeting with the client at ten.","لدينا اجتماع مع العميل في العاشرة."],["Agenda","أجيندا","جدول أعمال الاجتماع","The first item on the agenda is the budget.","البند الأول في جدول الأعمال هو الميزانية."],["Deadline","ديدلاين","الموعد النهائي","The deadline for the report is Thursday.","الموعد النهائي للتقرير يوم الخميس."],["Schedule","سكيديول","جدول زمني / مواعيد","Let me check my schedule first.","دعني أتحقق من جدولي أولًا."],["Report","ريبورت","تقرير","Please send me the monthly report.","من فضلك أرسل لي التقرير الشهري."],["Negotiation","نيجوشييشن","تفاوض","Good negotiation needs preparation and patience.","التفاوض الجيد يحتاج تحضيرًا وصبرًا."],["Contract","كونتراكت","عقد","We signed the contract last week.","وقّعنا العقد الأسبوع الماضي."],["Budget","بادجيت","ميزانية","The project is within the budget.","المشروع ضمن حدود الميزانية."],["Invoice","إنفويس","فاتورة","The supplier sent the invoice yesterday.","أرسل المورّد الفاتورة أمس."],["Client","كلاينت","عميل","Our client is happy with the results.","عميلنا راضٍ عن النتائج."],["Supplier","سابلاير","مورّد","We are looking for a reliable supplier.","نبحث عن مورّد موثوق."],["Presentation","بريزنتيشن","عرض تقديمي","Her presentation was clear and short.","كان عرضها التقديمي واضحًا وقصيرًا."],["Feedback","فيدباك","ملاحظات / تقييم","Thank you for your feedback on my work.","شكرًا على ملاحظاتك على عملي."],["Manager","مانيجر","مدير","My manager approved the plan.","وافق مديري على الخطة."],["Employee","إمبلويي","موظف","Every employee must attend the training.","يجب على كل موظف حضور التدريب."],["Department","ديبارتمنت","قسم / إدارة","I work in the safety department.","أعمل في إدارة السلامة."],["Marketing","ماركيتينج","التسويق","Marketing helps us reach new customers.","يساعدنا التسويق في الوصول إلى عملاء جدد."],["Sales","سيلز","المبيعات","Sales increased this quarter.","زادت المبيعات هذا الربع."],["Profit","بروفيت","ربح","The company made a good profit this year.","حققت الشركة ربحًا جيدًا هذا العام."],["Project","بروجكت","مشروع","This project will finish in December.","سينتهي هذا المشروع في ديسمبر."],["Task","تاسك","مهمة","My main task today is reviewing the reports.","مهمتي الرئيسية اليوم مراجعة التقارير."],["Appointment","أبوينتمنت","موعد","I have an appointment with the doctor at noon.","لدي موعد مع الطبيب ظهرًا."],["Minutes of Meeting","مينيتس أوف ميتينج","محضر اجتماع","Please share the minutes of meeting with the team.","من فضلك شارك محضر الاجتماع مع الفريق."],["Follow Up","فولو أب","متابعة","I will follow up on this point tomorrow.","سأتابع هذه النقطة غدًا."],["Quarter","كوارتر","ربع سنة (ثلاثة أشهر)","We review our goals every quarter.","نراجع أهدافنا كل ربع سنة."],["Target","تارجيت","هدف / مستهدف","We reached our sales target.","حققنا مستهدف المبيعات."],["Teamwork","تيم وورك","العمل الجماعي","Teamwork makes the project succeed.","العمل الجماعي يجعل المشروع ينجح."],["Branch","برانش","فرع (شركة)","Our company has a branch in Jeddah.","لشركتنا فرع في جدة."],["Head Office","هيد أوفيس","المقر الرئيسي","The head office is in Riyadh.","المقر الرئيسي في الرياض."],["Reschedule","ري سكيديول","إعادة جدولة","Can we reschedule the meeting to Sunday?","هل يمكننا إعادة جدولة الاجتماع إلى الأحد؟"],["Attached","أتاتشد","مرفق (في البريد)","Please find the file attached.","من فضلك اطّلع على الملف المرفق."],["Confirm","كونفيرم","يؤكّد","Please confirm that you received my email.","من فضلك أكّد استلامك لبريدي."]],phrases:[["Let us schedule a meeting for next week.","لنجدول اجتماعًا للأسبوع القادم."],["Could you send me the report by Thursday, please?","هل يمكنك إرسال التقرير لي بحلول الخميس من فضلك؟"],["Let us move to the next item on the agenda.","لننتقل إلى البند التالي في جدول الأعمال."],["In my opinion, this plan is better.","في رأيي، هذه الخطة أفضل."],["I agree with you on this point.","أتفق معك في هذه النقطة."],["That is a very good point.","هذه نقطة ممتازة."],["Please find the document attached.","من فضلك اطّلع على المستند المرفق."],["I will get back to you as soon as possible.","سأعود إليك في أقرب وقت ممكن."],["Can we reschedule our appointment?","هل يمكننا إعادة جدولة موعدنا؟"],["We need to meet the deadline.","نحتاج إلى الالتزام بالموعد النهائي."],["Let me check my calendar.","دعني أتحقق من تقويمي."],["Thank you for your time and support.","شكرًا على وقتك ودعمك."],["To sum up, we agreed on three actions.","لتلخيص ما سبق، اتفقنا على ثلاثة إجراءات."],["Looking forward to hearing from you.","أتطلع إلى ردّك."],["Please do not hesitate to contact me.","من فضلك لا تتردد في التواصل معي."],["Let us discuss this in more detail.","لندعنا نناقش هذا بمزيد من التفصيل."]],dialogues:[["بدء اجتماع ومراجعة جدول الأعمال",[["Manager","Good morning, everyone. Thank you for coming on time.","صباح الخير جميعًا. شكرًا لحضوركم في الموعد."],["Employee","Good morning. Are we going to discuss the new project today?","صباح الخير. هل سنناقش المشروع الجديد اليوم؟"],["Manager","Yes. First, the project schedule. Second, the budget.","نعم. أولًا: الجدول الزمني للمشروع. ثانيًا: الميزانية."],["Employee","I prepared a short report about the schedule.","أعددت تقريرًا قصيرًا عن الجدول الزمني."],["Manager","Excellent. Please present it, and keep it short, please.","ممتاز. من فضلك اعرضه، واجعله قصيرًا."]]],["مكالمة لترتيب موعد",[["Caller","Hello, this is Abdelmoniem from the safety department. Can I speak to Mr. Khalid, please?","مرحبًا، معك عبدالمنعم من إدارة السلامة. هل يمكنني التحدث إلى الأستاذ خالد من فضلك؟"],["Secretary","Hello. Mr. Khalid is in a meeting now. Can I take a message?","مرحبًا. الأستاذ خالد في اجتماع الآن. هل آخذ رسالة؟"],["Caller","Yes, please. I would like to schedule an appointment with him next week.","نعم من فضلك. أود تحديد موعد معه الأسبوع القادم."],["Secretary","Sunday at eleven is available. Shall I confirm it?","الأحد في الحادية عشرة متاح. هل أؤكّده؟"],["Caller","Yes, please confirm it. Thank you very much.","نعم، من فضلك أكّديه. شكرًا جزيلًا."]]]]},{id:"entrepreneurship",icon:"🚀",title:"إنجليزي ريادة الأعمال",sub:"Startup English — للعروض والحاضنات والمستثمرين",terms:[["Startup","ستارت أب","شركة ناشئة","Our startup helps teachers build online academies.","شركتنا الناشئة تساعد المعلمين على بناء أكاديميات إلكترونية."],["Entrepreneur","أونتربرونور","رائد أعمال","An entrepreneur turns an idea into a real business.","رائد الأعمال يحوّل الفكرة إلى مشروع حقيقي."],["Founder","فاوندر","مؤسس","He is the founder of the academy.","هو مؤسس الأكاديمية."],["Business Model","بيزنس مودل","نموذج العمل (كيف يربح المشروع)","Our business model is based on subscriptions.","نموذج عملنا قائم على الاشتراكات."],["Revenue","ريفينيو","إيرادات","Revenue grew after we launched the new course.","نمت الإيرادات بعد إطلاق الدورة الجديدة."],["Seed Funding","سيد فاندينج","تمويل أولي","We are raising seed funding this year.","نجمع تمويلًا أوليًا هذا العام."],["Investor","إنفيستور","مستثمر","The investor asked about our growth numbers.","سأل المستثمر عن أرقام نمونا."],["Pitch","بيتش","عرض المشروع أمام المستثمرين","Keep your pitch short and clear.","اجعل عرض مشروعك قصيرًا وواضحًا."],["Incubator","إنكيوبيتور","حاضنة أعمال","The incubator provides mentoring and office space.","توفر الحاضنة إرشادًا ومكانًا للعمل."],["Accelerator","أكسيليريتور","مسرّعة أعمال","The accelerator program lasts three months.","يستمر برنامج المسرّعة ثلاثة أشهر."],["Mentor","مينتور","مرشد / موجّه","A good mentor saves you years of mistakes.","المرشد الجيد يوفّر عليك سنوات من الأخطاء."],["Target Market","تارجيت ماركيت","السوق المستهدف","Our target market is families in the Gulf.","سوقنا المستهدف هو الأسر في الخليج."],["Customer","كاستومر","عميل / زبون","Listen to your customer before you build.","استمع إلى عميلك قبل أن تبني."],["Growth","جروث","نمو","We focus on steady growth, not fast hype.","نركّز على نمو ثابت، لا ضجة سريعة."],["Scale","سكيل","التوسّع / النمو الكبير","Now we are ready to scale the platform.","الآن نحن جاهزون لتوسيع المنصة."],["Break-Even Point","بريك إيفن بوينت","نقطة التعادل","We reached the break-even point in month nine.","وصلنا إلى نقطة التعادل في الشهر التاسع."],["Cash Flow","كاش فلو","التدفق النقدي","Positive cash flow keeps the startup alive.","التدفق النقدي الإيجابي يبقي الشركة الناشئة حية."],["Equity","إكويتي","حصة ملكية","The founders keep most of the equity.","يحتفظ المؤسسون بمعظم حصص الملكية."],["Valuation","فاليويشن","تقييم الشركة (قيمتها)","Our valuation is based on real revenue.","تقييم شركتنا مبني على إيرادات حقيقية."],["Prototype","بروتوتايب","نموذج أولي","We built a prototype in two weeks.","بنينا نموذجًا أوليًا في أسبوعين."],["Minimum Viable Product (MVP)","مينيوم فايابل برودكت","المنتج الأولي الأدنى القابل للتجربة","Launch an MVP and learn from users.","أطلق منتجًا أوليًا وتعلّم من المستخدمين."],["Launch","لونش","إطلاق","We will launch the platform next month.","سنطلق المنصة الشهر القادم."],["Brand","براند","علامة تجارية","A strong brand builds trust.","العلامة التجارية القوية تبني الثقة."],["Competitor","كومبيتيتور","منافس","Know your competitor, but focus on your customer.","اعرف منافسك، لكن ركّز على عميلك."],["Strategy","ستراتيجي","استراتيجية","Our strategy is quality before speed.","استراتيجيتنا هي الجودة قبل السرعة."],["Opportunity","أوبورتشونيتي","فرصة","Every problem is an opportunity for a startup.","كل مشكلة هي فرصة لشركة ناشئة."],["Subscription","سابسكريبشن","اشتراك","Users pay a monthly subscription.","يدفع المستخدمون اشتراكًا شهريًا."],["Traction","تراكشن","زخم / إقبال حقيقي مثبت بالأرقام","Investors look for traction, not only ideas.","يبحث المستثمرون عن زخم حقيقي، لا أفكار فقط."],["Pitch Deck","بيتش ديك","عرض شرائح المشروع","Our pitch deck has twelve slides.","عرض شرائح مشروعنا فيه اثنتا عشرة شريحة."],["Milestone","مايلستون","محطة / هدف مرحلي","Reaching one hundred students is our next milestone.","الوصول إلى مئة طالب هو محطتنا التالية."],["Partnership","بارتنرشيب","شراكة","We signed a partnership with a local academy.","وقّعنا شراكة مع أكاديمية محلية."],["Return on Investment (ROI)","ريتيرن أون إنفيستمنت","العائد على الاستثمار","Investors always ask about the return on investment.","يسأل المستثمرون دائمًا عن العائد على الاستثمار."]],phrases:[["Our startup solves a real problem.","شركتنا الناشئة تحل مشكلة حقيقية."],["We help teachers launch their own online academies.","نساعد المعلمين على إطلاق أكاديمياتهم الإلكترونية الخاصة."],["Our target market is families in the Gulf region.","سوقنا المستهدف هو الأسر في منطقة الخليج."],["Our business model is based on monthly subscriptions.","نموذج عملنا قائم على اشتراكات شهرية."],["We already have paying customers.","لدينا بالفعل عملاء يدفعون."],["We are raising seed funding to grow the team.","نجمع تمويلًا أوليًا لتنمية الفريق."],["Let me present our pitch in five minutes.","دعني أعرض مشروعنا في خمس دقائق."],["Our competitive advantage is live teaching quality.","ميزتنا التنافسية هي جودة التعليم المباشر."],["The market is large and growing every year.","السوق كبير وينمو كل عام."],["We reached the break-even point this year.","وصلنا إلى نقطة التعادل هذا العام."],["We are looking for a mentor in education technology.","نبحث عن مرشد في تقنية التعليم."],["What percentage of equity do you offer?","ما نسبة حصة الملكية التي تعرضونها؟"],["Our next milestone is one thousand students.","محطتنا التالية هي ألف طالب."],["Thank you for your time. I welcome your questions.","شكرًا لوقتكم. أرحّب بأسئلتكم."],["We plan to launch in Saudi Arabia first.","نخطط للإطلاق في السعودية أولًا."],["Traction matters more than ideas.","الزخم الحقيقي أهم من الأفكار."]],dialogues:[["عرض مشروع أمام مستثمر (Pitch)",[["Investor","Tell me about your startup in one sentence.","حدثني عن شركتك الناشئة في جملة واحدة."],["Founder","We help teachers start their own online academies.","نساعد المعلمين على بدء أكاديمياتهم الإلكترونية الخاصة."],["Investor","Interesting. Do you have paying customers already?","مثير للاهتمام. هل لديك عملاء يدفعون بالفعل؟"],["Founder","Yes. We started with our own academy. Many teachers join us now.","نعم. بدأنا بأكاديميتنا الخاصة. والآن ينضم إلينا معلمون كثيرون."],["Investor","And how do you make money?","وكيف تحققون الربح؟"],["Founder","Teachers pay a setup fee and monthly fees. We take zero commission.","يدفع المعلمون رسم إعداد ورسومًا شهرية. ولا نأخذ أي عمولة."]]],["مقابلة قبول في حاضنة أعمال",[["Mentor","Why do you want to join our incubator?","لماذا تريد الانضمام إلى حاضنتنا؟"],["Founder","We need mentoring in marketing and legal setup, and access to investors.","نحتاج إرشادًا في التسويق والتأسيس القانوني، ووصولًا إلى المستثمرين."],["Mentor","What is your biggest challenge right now?","ما أكبر تحدٍّ تواجهه الآن؟"],["Founder","Reaching our first paying students outside our own network.","الوصول إلى أول طلاب دافعين خارج شبكتنا الخاصة."],["Mentor","Good, that is honest. What will you do in the first three months here?","جيد، هذه إجابة صادقة. ماذا ستفعل في أول ثلاثة أشهر هنا؟"],["Founder","We will test our offer with twenty teachers and improve the product every week.","سنختبر عرضنا مع عشرين معلمًا ونحسّن المنتج كل أسبوع."]]]]},{id:"islamic",icon:"🕌",title:"الإنجليزي الإسلامي",sub:"Islamic English — لشرح الإسلام والعبادات بدقة واحترام",terms:[["Allah","الله (تُنطق: ألّاه)","الله سبحانه وتعالى","Muslims believe in one God, Allah.","يؤمن المسلمون بإله واحد، الله."],["Islam","إسلام","الإسلام (الاستسلام لله بسلام)","Islam is a religion of peace and mercy.","الإسلام دين سلام ورحمة."],["Muslim","مسلم","المسلم","A Muslim worships Allah alone.","المسلم يعبد الله وحده."],["Prophet Muhammad ﷺ","بروفِت محمد","النبي محمد صلى الله عليه وسلم","Prophet Muhammad, peace be upon him, is the final messenger of Allah.","النبي محمد صلى الله عليه وسلم هو خاتم رسل الله."],["Quran","قرآن","القرآن الكريم","The Quran is the holy book of Islam.","القرآن هو الكتاب المقدس في الإسلام."],["Surah","سورة","سورة (من سور القرآن)","Al-Fatihah is the first surah of the Quran.","الفاتحة هي أول سورة في القرآن."],["Ayah","آية","آية (من آيات القرآن)","This ayah teaches patience in hard times.","هذه الآية تعلّم الصبر في الأوقات الصعبة."],["Hadith","حديث","الحديث النبوي","A hadith is a saying or action of the Prophet ﷺ.","الحديث هو قول أو فعل للنبي صلى الله عليه وسلم."],["Sunnah","سُنّة","السنة النبوية (طريقة النبي ﷺ)","Muslims follow the Sunnah of the Prophet ﷺ in daily life.","يتبع المسلمون سنة النبي صلى الله عليه وسلم في الحياة اليومية."],["Salah (Prayer)","صلاة","الصلاة","Muslims perform Salah five times a day.","يؤدي المسلمون الصلاة خمس مرات في اليوم."],["Wudu (Ablution)","وضوء","الوضوء","We make Wudu before prayer.","نتوضأ قبل الصلاة."],["Sawm (Fasting)","صوم","الصوم","Fasting teaches patience and gratitude.","الصوم يعلّم الصبر والشكر."],["Ramadan","رمضان","شهر رمضان","Ramadan is the month of fasting and the Quran.","رمضان هو شهر الصوم والقرآن."],["Zakat (Charity)","زكاة","الزكاة","Zakat is giving part of your wealth to the poor.","الزكاة هي إعطاء جزء من مالك للفقراء."],["Hajj (Pilgrimage)","حج","الحج","Hajj is a journey to Makkah once in a lifetime.","الحج رحلة إلى مكة مرة في العمر."],["Mosque","موسك","المسجد","The mosque is a place of worship and learning.","المسجد مكان للعبادة والتعلّم."],["Adhan (Call to Prayer)","أذان","الأذان","The Adhan calls people to prayer.","الأذان يدعو الناس إلى الصلاة."],["Jumu'ah (Friday Prayer)","جمعة","صلاة الجمعة","Muslims gather for Jumu'ah prayer every Friday.","يجتمع المسلمون لصلاة الجمعة كل أسبوع."],["Iman (Faith)","إيمان","الإيمان","Iman means faith in Allah and His messenger.","الإيمان يعني التصديق بالله ورسوله."],["Tawhid (Monotheism)","توحيد","التوحيد","Tawhid is the belief that Allah is one.","التوحيد هو الإيمان بأن الله واحد."],["Worship","وورشيب","العبادة","Worship in Islam includes prayer, charity and good manners.","العبادة في الإسلام تشمل الصلاة والصدقة وحسن الخلق."],["Mercy","ميرسي","الرحمة","Allah is the Most Merciful.","الله هو أرحم الراحمين."],["Patience","بيشنس","الصبر","Patience is a great value in Islam.","الصبر قيمة عظيمة في الإسلام."],["Gratitude","جراتيتيود","الشكر والامتنان","Gratitude brings more blessings.","الشكر يجلب مزيدًا من النعم."],["Honesty","أونستي","الصدق والأمانة","Honesty is a sign of true faith.","الصدق علامة على الإيمان الحقيقي."],["Modesty","مودستي","الحياء والاحتشام","Modesty is part of faith.","الحياء شعبة من الإيمان."],["Halal (Permissible)","حلال","الحلال (المباح)","Muslims eat halal food.","يأكل المسلمون الطعام الحلال."],["Congregation","كونجريجيشن","الجماعة (في الصلاة)","Praying in congregation has a great reward.","الصلاة في جماعة لها أجر عظيم."],["Jannah (Paradise)","جنّة","الجنة","Believers hope for Jannah by Allah's mercy.","يرجو المؤمنون الجنة برحمة الله."],["Peace","بيس","السلام","The greeting of Islam is peace: As-salamu alaykum.","تحية الإسلام هي السلام: السلام عليكم."]],phrases:[["As-salamu alaykum — peace be upon you.","السلام عليكم — تحية الإسلام."],["Islam means peace and submission to Allah.","الإسلام يعني السلام والاستسلام لله."],["Muslims believe in one God, Allah.","يؤمن المسلمون بإله واحد، الله."],["Prophet Muhammad, peace be upon him, is the final messenger.","النبي محمد صلى الله عليه وسلم هو خاتم الرسل."],["The Quran is the word of Allah.","القرآن هو كلام الله."],["Muslims pray five times a day.","يصلي المسلمون خمس مرات في اليوم."],["Fasting in Ramadan teaches patience and self-control.","الصوم في رمضان يعلّم الصبر وضبط النفس."],["Charity is one of the pillars of Islam.","الزكاة إحدى أركان الإسلام."],["In sha Allah — if Allah wills.","إن شاء الله — إذا أراد الله."],["Alhamdulillah — all praise is due to Allah.","الحمد لله — كل الحمد لله."],["Islam teaches kindness to parents and neighbours.","يعلّم الإسلام الإحسان إلى الوالدين والجيران."],["The mosque is a place of worship.","المسجد مكان للعبادة."],["Let me explain this concept in simple words.","دعني أشرح هذا المفهوم بكلمات بسيطة."],["Honesty and justice are core values in Islam.","الصدق والعدل قيم أساسية في الإسلام."],["Pilgrims travel to Makkah once in a lifetime, if they are able.","يسافر الحجاج إلى مكة مرة في العمر، إن استطاعوا."],["Thank you for your respectful question.","شكرًا على سؤالك المحترم."]],dialogues:[["شرح الصلاة لزميل غير مسلم",[["Colleague","May I ask why you leave at noon every day?","هل يمكنني أن أسأل: لماذا تغادر المكتب ظهرًا كل يوم؟"],["Teacher","Of course. I go to pray. We pray five times a day.","بالتأكيد. أذهب للصلاة. نصلي خمس مرات في اليوم."],["Colleague","How long does it take?","كم تستغرق؟"],["Teacher","About ten minutes. Prayer connects us with Allah. It gives us peace.","نحو عشر دقائق. الصلاة تصلنا بالله. وتمنحنا السلام."],["Colleague","Thank you for explaining. That is clear and simple.","شكرًا على الشرح. هذا واضح وبسيط."]]],["شرح رمضان لزائر",[["Visitor","I heard this month is Ramadan. What do Muslims do in Ramadan?","سمعت أن هذا الشهر هو رمضان. ماذا يفعل المسلمون في رمضان؟"],["Teacher","In Ramadan, we fast from dawn to sunset. We do not eat or drink during the day.","في رمضان نصوم من الفجر حتى غروب الشمس. لا نأكل ولا نشرب أثناء النهار."],["Visitor","That sounds hard. Why do you fast?","يبدو صعبًا. لماذا تصومون؟"],["Teacher","Fasting teaches patience and gratitude, and it helps us feel with the poor. At sunset, families break the fast together.","الصوم يعلّم الصبر والشكر، ويساعدنا على الشعور بالفقراء. وعند الغروب تفطر الأسر معًا."],["Visitor","Beautiful. Thank you for sharing this with me.","جميل. شكرًا لمشاركتك هذا معي."]]]]}],LISTENING={safety:[[["ما الموضوع الرئيسي لمحادثة اجتماع السلامة؟",["العمل على ارتفاع وفحص الحزام","صيانة الماكينات","تنظيف الموقع","مواعيد الوردية"],0],["ماذا يجب أن يفعل العمال طوال وقت العمل على ارتفاع؟",["خلع الخوذة","ربط الحزام باستمرار","العمل بسرعة أكبر","إيقاف الرياح"],1],["ماذا يحدث إذا اشتدّت الرياح؟",["نكمل العمل","نغيّر المهمة","نوقف العمل فورًا","نطلب عمالًا أكثر"],2]],[["ماذا رأى العامل قرب اللوحة؟",["كابلًا على أرض مبللة","عاملًا بلا خوذة","طفاية فارغة","سقالة مكسورة"],0],["ما أول إجراء طلبه مسؤول السلامة؟",["إكمال العمل بسرعة","إبعاد الناس عن المنطقة","تصوير المكان","إغلاق الموقع كله"],1],["متى يُستأنف العمل في تلك المنطقة؟",["بعد ساعة","في اليوم التالي","بعد أن يصلح الكهربائي المشكلة","لا يُستأنف أبدًا"],2]]],business:[[["ما البند الأول في جدول أعمال الاجتماع؟",["الميزانية","الجدول الزمني للمشروع","التوظيف","التسويق"],1],["ماذا أعدّ الموظف للاجتماع؟",["عرضًا تسويقيًا","تقريرًا قصيرًا عن الجدول الزمني","قائمة عملاء","ميزانية جديدة"],1],["ماذا طلب المدير بخصوص العرض؟",["أن يكون طويلًا","أن يُلغى","أن يكون قصيرًا","أن يُرسل بالبريد"],2]],[["من أين يتصل عبدالمنعم؟",["إدارة التسويق","إدارة السلامة","المقر الرئيسي","فرع جدة"],1],["لماذا لم يستطع التحدث إلى الأستاذ خالد فورًا؟",["لأنه مسافر","لأنه في اجتماع","لأنه في إجازة","لأن الخط مشغول"],1],["ما الموعد الذي تم تأكيده؟",["الاثنين ظهرًا","الأحد في الحادية عشرة","الخميس صباحًا","الأسبوع بعد القادم"],1]]],entrepreneurship:[[["بمَ تساعد الشركة الناشئة عملاءها؟",["في تعلّم اللغات","في إطلاق أكاديميات إلكترونية خاصة بهم","في بيع العقارات","في التوظيف الحكومي"],1],["كيف تحقق الشركة إيراداتها؟",["عمولة على كل حصة","رسم إعداد واشتراك شهري","بيع الكتب","إعلانات"],1],["ما نسبة العمولة التي تأخذها الشركة على حصص المعلمين؟",["١٠٪","٥٪","صفر — لا عمولة","٢٠٪"],2]],[["ماذا يحتاج المؤسس من الحاضنة؟",["قرضًا بنكيًا فقط","إرشادًا في التسويق والتأسيس ووصولًا للمستثمرين","مكتبًا أكبر فقط","موظفين مجانًا"],1],["ما أكبر تحدٍّ عند المؤسس الآن؟",["بناء المنتج","الوصول لأول طلاب دافعين خارج شبكته","تصميم الشعار","اختيار اسم الشركة"],1],["ماذا سيفعل في أول ثلاثة أشهر؟",["يفتح ثلاثة فروع","يختبر العرض مع عشرين معلمًا ويحسّن المنتج أسبوعيًا","يوظّف خمسين شخصًا","ينتظر التمويل"],1]]],islamic:[[["كم مرة يصلي المسلمون في اليوم؟",["مرة واحدة","ثلاث مرات","خمس مرات","سبع مرات"],2],["كم تستغرق صلاة الظهر تقريبًا حسب الحوار؟",["ساعة","نحو عشر دقائق","نصف ساعة","دقيقتين"],1],["ماذا تمنح الصلاة للمسلم أثناء اليوم حسب الحوار؟",["مالًا","سلامًا واتصالًا بالله","نومًا عميقًا","طاقة رياضية"],1]],[["متى يصوم المسلمون في رمضان؟",["من الظهر إلى المغرب","من الفجر حتى غروب الشمس","يومًا واحدًا فقط","في الليل فقط"],1],["ما الذي يعلّمه الصوم حسب الحوار؟",["الطبخ","الصبر والشكر والشعور بالفقراء","الرياضة","اللغات"],1],["ماذا تفعل الأسر عند غروب الشمس؟",["تبدأ الصوم","تفطر معًا","تذهب للعمل","تنام مبكرًا"],1]]]},ROLEPLAYS={safety:[{title:"أنت مسؤول السلامة: أوقف عملًا غير آمن",intro:"أنت مسؤول السلامة في الموقع. عامل يعمل على سقالة دون ربط حزامه. تحدّث معه وحقّق النتيجة الآمنة.",steps:[{sys_en:"",sys_ar:"ابدأ أنت الحديث مع العامل:",choices:[{en:"Stop! Come down now, this is dangerous.",ar:"توقف! انزل الآن، هذا خطير.",good:!1,react_en:"The worker is surprised and a little upset. Try a calmer, more professional start.",react_ar:"تفاجأ العامل وانزعج قليلًا. جرّب بداية أهدأ وأكثر مهنية."},{en:"Excuse me, my friend. Please stop for a moment and come down safely. I need to talk with you.",ar:"عفوًا يا صديقي. من فضلك توقف لحظة وانزل بأمان. أحتاج أن أتحدث معك.",good:!0,react_en:"The worker comes down calmly. Good start.",react_ar:"نزل العامل بهدوء. بداية موفقة."},{en:"Hey you! What are you doing up there?",ar:"أنت! ماذا تفعل هناك؟",good:!1,react_en:"The worker feels attacked. A respectful tone works better.",react_ar:"شعر العامل بالهجوم. الأسلوب المحترم يعمل بشكل أفضل."}]},{sys_en:"Why did you stop me? I am almost finished.",sys_ar:"لماذا أوقفتني؟ كدت أنتهي.",choices:[{en:"Because you broke the rules. This is your fault.",ar:"لأنك خالفت القواعد. هذا خطؤك.",good:!1,react_en:"The worker becomes defensive. Explain the risk, not the blame.",react_ar:"أصبح العامل دفاعيًا. اشرح الخطر، لا اللوم."},{en:"I stopped you because your harness is not tied off. A fall from this height can be fatal.",ar:"أوقفتك لأن حزامك غير مربوط. السقوط من هذا الارتفاع قد يكون قاتلًا.",good:!0,react_en:"The worker looks at his harness and understands.",react_ar:"نظر العامل إلى حزامه وفهم."},{en:"Company policy. Just sign this paper.",ar:"سياسة الشركة. فقط وقّع هذه الورقة.",good:!1,react_en:"Paper without explanation changes nothing. Explain first.",react_ar:"الورق دون شرح لا يغيّر شيئًا. اشرح أولًا."}]},{sys_en:"You are right, I am sorry. The anchor point is far from my work area.",sys_ar:"معك حق، أنا آسف. نقطة التثبيت بعيدة عن منطقة عملي.",choices:[{en:"Then work without the harness, but be careful.",ar:"إذن اعمل دون الحزام، لكن كن حذرًا.",good:!1,react_en:"Never allow work without protection. Find a safe solution instead.",react_ar:"لا تسمح أبدًا بالعمل دون حماية. ابحث عن حل آمن بدلًا من ذلك."},{en:"Thank you for telling me. We will move the anchor point closer, and use a longer lanyard. Do not climb again until it is ready.",ar:"شكرًا لإخباري. سنقرّب نقطة التثبيت ونستخدم حبلًا أطول. لا تصعد مرة أخرى حتى يجهز.",good:!0,react_en:"Excellent. You fixed the root cause and kept the worker safe.",react_ar:"ممتاز. عالجت السبب الجذري وحافظت على سلامة العامل."},{en:"That is not my problem. Finish your work today.",ar:"هذه ليست مشكلتي. أنهِ عملك اليوم.",good:!1,react_en:"Ignoring a reported problem is a serious failure for a safety officer.",react_ar:"تجاهل مشكلة مُبلَّغ عنها فشل خطير لمسؤول السلامة."}]},{sys_en:"Thank you. I will wait until the anchor point is ready.",sys_ar:"شكرًا لك. سأنتظر حتى تجهز نقطة التثبيت.",choices:[{en:"Good. And remember: if you see any hazard, report it to me immediately.",ar:"جيد. وتذكّر: إذا رأيت أي خطر، أبلغني فورًا.",good:!0,react_en:"The worker smiles and nods. The site is safer now.",react_ar:"ابتسم العامل وأومأ. أصبح الموقع أكثر أمانًا الآن."},{en:"OK, go now.",ar:"حسنًا، اذهب الآن.",good:!1,react_en:"A short ending, but you missed the chance to build a reporting culture.",react_ar:"نهاية قصيرة، لكنك فوّتّ فرصة بناء ثقافة إبلاغ."}]}]},{title:"أنت العامل: أبلغ عن خطر",intro:"أنت عامل في الموقع ورأيت ماءً قرب لوحة كهرباء. اذهب إلى مسؤول السلامة وأبلغه بشكل صحيح.",steps:[{sys_en:"",sys_ar:"ابدأ أنت الحديث مع مسؤول السلامة:",choices:[{en:"Excuse me, sir. I need to report a hazard near the electrical panel.",ar:"عفوًا يا سيدي. أحتاج أن أبلغ عن خطر قرب لوحة الكهرباء.",good:!0,react_en:"The safety officer listens carefully.",react_ar:"أصغى مسؤول السلامة بعناية."},{en:"There is water somewhere. Not my job.",ar:"يوجد ماء في مكان ما. ليست وظيفتي.",good:!1,react_en:"Reporting hazards IS every worker's job. Be specific and responsible.",react_ar:"الإبلاغ عن الأخطار هو وظيفة كل عامل. كن محددًا ومسؤولًا."},{en:"Hey! Come and see this!",ar:"تعال وانظر هذا!",good:!1,react_en:"Too vague and impolite. Say what and where, respectfully.",react_ar:"غامض وغير مهذب. قل ماذا وأين، باحترام."}]},{sys_en:"Thank you. What exactly did you see?",sys_ar:"شكرًا لك. ماذا رأيت بالضبط؟",choices:[{en:"Something wet, maybe dangerous.",ar:"شيء مبلل، ربما خطير.",good:!1,react_en:"Too vague. Give clear details: what, where, since when.",react_ar:"غامض جدًا. أعطِ تفاصيل واضحة: ماذا، أين، منذ متى."},{en:"There is water on the floor next to the main electrical panel, and a cable is lying in it.",ar:"يوجد ماء على الأرض بجوار لوحة الكهرباء الرئيسية، وكابل ملقى فيه.",good:!0,react_en:"Clear and specific. The officer acts immediately.",react_ar:"واضح ومحدد. تصرّف الم مة؟",hint:"قدّم حالة المشروع بنسبة إنجاز",opts:[{say:"Good morning, Sarah. The project is on track. We finished seventy percent of the training sessions.",ar:"صباح الخير يا سارة. المشروع على المسار. أنهينا سبعين بالمئة من جلسات التدريب.",keys:[["on track"],["seventy percent","70"]],next:"Good progress. And the remaining sessions?",nextAr:"تقدّم جيد. وماذا عن الجلسات المتبقية؟"},{say:"Morning, Sarah. We are a little behind, but the team is working hard to catch up.",ar:"صباح الخير يا سارة. تأخرنا قليلًا، لكن الفريق يعمل بجد للحاق.",keys:[["behind"],["catch up"]],next:"I appreciate the honesty. What is your plan to catch up?",nextAr:"أقدّر الصراحة. ما خطتك للحاق؟"}]},{p:"When will the last session be finished?",pa:"متى ستنتهي الجلسة الأخيرة؟",hint:"حدّد موعدًا أو اطلب مهلة بسبب تأجيل",opts:[{say:"The last session is planned for next Thursday, if the trainer is available.",ar:"الجلسة الأخيرة مخططة للخميس القادم، إذا كان المدرب متاحًا.",keys:[["thursday"],["trainer"]],next:"Thursday works. Please confirm with the trainer today.",nextAr:"الخميس مناسب. من فضلك أكّد مع المدرب اليوم."},{say:"We need two more weeks, because two sessions were postponed.",ar:"نحتاج أسبوعين إضافيين، لأن جلستين تأجلتا.",keys:[["two more weeks"],["postponed"]],next:"I see. Send me the new schedule by email, please.",nextAr:"أفهم. أرسل لي الجدول الجديد بالبريد من فضلك."}]},{p:"The client asked for the attendance report. Can you send it today?",pa:"طلب العميل تقرير الحضور. هل يمكنك إرساله اليوم؟",hint:"وافق بموعد أو اقترح مسودة الآن ونهائي غدًا",opts:[{say:"Yes, I will send it before the end of the day with all the signatures.",ar:"نعم، سأرسله قبل نهاية اليوم مع جميع التوقيعات.",keys:[["send"],["end of the day","today"]],next:"Perfect. The client will be happy.",nextAr:"ممتاز. سيكون العميل سعيدًا."},{say:"I can send a draft now and the final report tomorrow morning.",ar:"أستطيع إرسال مسودة الآن والتقرير النهائي غدًا صباحًا.",keys:[["draft"],["tomorrow"]],next:"A draft now is fine. I need the final و انخفاض الحضور. بعض العمال في وردية ليلية.",keys:[["attendance"],["night shift"]],next:"Then reminders and supervisor support are key.",nextAr:"إذن التذكيرات ودعم المشرفين هما المفتاح."}]},{p:"How can we raise attendance?",pa:"كيف يمكننا رفع الحضور؟",hint:"اقترح تذكيرات أو تكرار الجلسة",opts:[{say:"Send reminders a day before, and ask supervisors to release their workers on time.",ar:"أرسلوا تذكيرات قبلها بيوم، واطلبوا من المشرفين إطلاق عمالهم في الوقت.",keys:[["reminders"],["supervisors"]],next:"Agreed. I will speak to the supervisors myself.",nextAr:"متفقة. سأتحدث مع المشرفين بنفسي."},{say:"We can repeat the session twice, morning and afternoon.",ar:"يمكننا تكرار الجلسة مرتين، صباحًا ومساءً.",keys:[["twice"],["afternoon"]],next:"That doubles the trainer's work, but it solves the shift problem.",nextAr:"هذا يضاعف عمل المدرب، لكنه يحل مشكلة الورديات."}]},{p:"Agreed. Can you prepare a short summary for the director?",pa:"متفقة. هل تستطيع إعداد ملخص قصير للمدير؟",hint:"وافق وحدّد محتوى الملخص وموعد التسليم",opts:[{say:"Sure. I will prepare one page with the progress, the risks, and the next steps.",ar:"بالتأكيد. سأعدّ صفحة واحدة بالتقدم والمخاطر والخطوات التالية.",keys:[["one page","summary"],["next steps"]],next:"One page is exactly what he likes.",nextAr:"صفحة واحدة هي بالضبط ما يحبه."},{say:"Yes, I will send it after lunch with the updated schedule.",ar:"نعم، سأرسله بعد الغداء مع الجدول المحدّث.",keys:[["after lunch"],["schedule"]],next:"After lunch is fine. Thank you.",nextAr:"بعد الغداء مناسب. شكرًا."}]},{p:"Excellent. When shall we meet again?",pa:"ممتاز. متى نجتمع مرة أخرى؟",hint:"اقترح موعد الاجتماع القادم",opts:[{say:"Let us meet next Monday at ten to review the final results.",ar:"لنجتمع الاثنين القادم في العاشرة لمراجعة النتائج النهائية.",keys:[["monday"],["ten"]],next:"Monday at ten is in my calendar now.",nextAr:"الاثنين في العاشرة في تقويمي الآن."},{say:"Same time next week works for me.",ar:"نفس الوقت الأسبوع القادم يناسبني.",keys:[["next week"],["works for me"]],next:"Done. Same time, same room.",nextAr:"تم. نفس الوقت، نفس الغرفة."}]},{p:"Thank you for the clear update, {name}.",pa:"شكرًا على التحديث الواضح.",hint:"اشكرها وأكّد التعاون أو التحديث الأسبوعي",opts:[{say:"You are welcome, Sarah. Teamwork makes everything easier.",ar:"على الرحب والسعة يا سارة. العمل الجماعي يجعل كل شيء أسهل.",keys:[["welcome"],["teamwork"]],next:"It does. See you on Monday!",nextAr:"حقًا. أراك يوم الاثنين!"},{say:"Thank you too. I will keep you updated every week.",ar:"شكرًا لك أيضًا. سأبقيك على اطّلاع كل أسبوع.",keys:[["keep you updated"],["every week"]],next:"That is all I ask. Have a good day!",nextAr:"هذا كل ما أطلبه. يومك سعيد!"}]}]},{id:"buddy_pitch",icon:"🚀",level:"B1",title:"أسئلة مستثمر — عرض مشروعك",partner:"Mr. Khalid",desc:"مستثمر يسألك عن أكاديمية ثقة — دافع عن فكرتك بثقة.",turns:[{p:"Welcome, {name}. Tell me: what is your startup, in one sentence?",pa:"مرحبًا بك. أخبرني: ما شركتك الناشئة، في جملة واحدة؟",hint:"عرّف بالأكاديمية: قرآن وعربية بمعلمين أحياء",opts:[{say:"We built an online academy that teaches the Quran and Arabic to students around the world with live teachers.",ar:"بنينا أكاديمية إلكترونية تعلّم القرآن والعربية لطلاب حول العالم بمعلمين أحياء.",keys:[["academy"],["quran"],["teachers"]],next:"Clear. And what problem do you solve for families?",nextAr:"واضح. وما المشكلة التي تحلها للأسر؟"},{say:"My startup is an education platform for Quran and Arabic with live one-to-one classes.",ar:"شركتي منصة تعليمية للقرآن والعربية بحصص حية فردية.",keys:[["platform"],["one-to-one","live"]],next:"Good. Who needs this, and why?",nextAr:"جيد. من يحتاج هذا، ولماذا؟"}]},{p:"What problem do families face today?",pa:"ما المشكلة التي تواجهها الأسر اليوم؟",hint:"اشرح صعوبة إيجاد معلم مؤهل أو قضية الثقة",opts:[{say:"Many families abroad cannot find qualified Quran teachers near their homes. We bring the teacher to their home, online.",ar:"كثير من الأسر في الخارج لا تجد معلمي قرآن مؤهلين قرب بيوتها. نحن نجلب المعلم إلى بيتهم إلكترونيًا.",keys:[["families"],["teachers"],["online"]],next:"A real pain. How big is this market?",nextAr:"ألم حقيقي. ما حجم هذا السوق؟"},{say:"Parents worry about quality and safety. We offer trusted teachers, reports, and supervision.",ar:"الأهل قلقون بشأن الجودة والسلامة. نقدّم معلمين موثوقين وتقارير وإشرافًا.",keys:[["quality"],["trusted","reports","supervision"]],next:"Trust is everything in education. What about market size?",nextAr:"الثقة كل شيء في التعليم. ماذا عن حجم السوق؟"}]},{p:"How big is this market, honestly?",pa:"ما حجم هذا السوق، بصراحة؟",hint:"اذكر حجم الجمهور ونمو التعليم الإلكتروني",opts:[{say:"Millions of Muslim families live outside Muslim countries, and they spend on their children's religious education every year.",ar:"ملايين الأسر المسلمة تعيش خارج الدول المسلمة، وينفقون على تعليم أبنائهم الديني كل عام.",keys:[["millions"],["families"],["every year"]],next:"Big enough. Do you have traction yet?",nextAr:"كبير بما يكفي. هل لديك زخم حتى الآن؟"},{say:"The online education market is growing fast, and Quran learning is a strong niche inside it.",ar:"سوق التعليم الإلكتروني ينمو بسرعة، وتعلّم القرآن قطاع قوي داخله.",keys:[["growing"],["niche","market"]],next:"Growth helps. Show me traction, though.",nextAr:"النمو يساعد. لكن أرني الزخم."}]},{p:"Do you have paying customers?",pa:"هل لديك عملاء دافعون؟",hint:"كن صادقًا: الإطلاق الآن والهدف أول مئة أسرة",opts:[{say:"We are launching now. Our goal is the first hundred paying families in the first months.",ar:"نحن ننطلق الآن. هدفنا أول مئة أسرة دافعة في الأشهر الأولى.",keys:[["launching"],["hundred"],["paying"]],next:"Honest answer. I prefer honesty to big claims.",nextAr:"إجابة صادقة. أفضّل الصدق على الادعاءات الكبيرة."},{say:"The platform is ready, and we are starting with our first group of students this season.",ar:"المنصة جاهزة، ونبدأ مع أول مجموعة طلاب هذا الموسم.",keys:[["ready"],["first"],["students"]],next:"Ready is good. How do you make money?",nextAr:"الجاهزية جيدة. كيف تربحون؟"}]},{p:"How do you make money?",pa:"كيف تربحون؟",hint:"اشترك شهري مقابل حزم حصص حية",opts:[{say:"Families pay a monthly subscription for a package of live classes.",ar:"الأسر تدفع اشتراكًا شهريًا مقابل حزمة حصص حية.",keys:[["subscription"],["monthly"]],next:"Simple model. Who is on your team?",nextAr:"نموذج بسيط. من في فريقك؟"},{say:"Our model is simple: monthly packages per student, with family discounts.",ar:"نموذجنا بسيط: حزم شهرية لكل طالب، مع خصومات للأسر.",keys:[["monthly"],["packages"]],next:"Clear pricing. Tell me about the team.",nextAr:"تسعير واضح. حدّثني عن الفريق."}]},{p:"Who is on your team?",pa:"من في فريقك؟",hint:"عرّف بنفسك كمؤسس ومعلمي مصر والفريق التقني",opts:[{say:"I am the founder. I teach Quran myself, and I work with teachers and a technical team.",ar:"أنا المؤسس. أعلّم القرآن بنفسي، وأعمل مع معلمين وفريق تقني.",keys:[["founder"],["teach"],["teachers"]],next:"A founder who teaches — that is a strong sign.",nextAr:"مؤسس يعلّم بنفسه — هذه علامة قوية."},{say:"We have qualified teachers from Egypt and a small product team.",ar:"لدينا معلمون مؤهلون من مصر وفريق منتج صغير.",keys:[["teachers"],["egypt"]],next:"Egypt is a smart choice for teachers. How much are you raising?",nextAr:"مصر اختيار ذكي للمعلمين. كم تجمعون؟"}]},{p:"How much are you raising, and for what?",pa:"كم تجمعون، ولأجل ماذا؟",hint:"حدّد استخدام التمويل: تسويق ومعلمون ومنتج",opts:[{say:"We are raising a seed round to grow marketing and to hire more teachers.",ar:"نجمع جولة تأسيسية لتنمية التسويق وتوظيف مزيد من المعلمين.",keys:[["raising"],["marketing"],["teachers"]],next:"Marketing and supply — a balanced plan.",nextAr:"تسويق وعرض — خطة متوازنة."},{say:"We need funding for product development and for reaching families in Europe and America.",ar:"نحتاج تمويلًا لتطوير المنتج والوصول إلى أسر في أوروبا وأمريكا.",keys:[["funding"],["europe","america"]],next:"Those markets pay well. What is your biggest risk?",nextAr:"تلك الأسواق تدفع جيدًا. ما أكبر مخاطركم؟"}]},{p:"What is your biggest risk?",pa:"ما أكبر مخاطركم؟",hint:"الثقة أو المنافسة — وكيف تواجهونها",opts:[{say:"Our biggest risk is trust. Parents must trust an online teacher with their children, so supervision and quality are our priority.",ar:"أكبر خطر هو الثقة. يجب أن يثق الأهل بمعلم إلكتروني مع أبنائهم، لذا الإشراف والجودة أولويتنا.",keys:[["trust"],["quality"]],next:"You named the real risk. Why will you win?",nextAr:"سمّيت الخطر الحقيقي. لماذا ستفوزون؟"},{say:"Competition is a risk, but our live teaching and personal follow-up are different.",ar:"المنافسة خطر، لكن تعليمنا الحي ومتابعتنا الشخصية مختلفان.",keys:[["competition"],["different"]],next:"Differentiation matters. Why you, personally?",nextAr:"التميّز مهم. لماذا أنت شخصيًا؟"}]},{p:"Why you? Why will you win?",pa:"لماذا أنت؟ لماذا ستفوز؟",hint:"إجازتك وخبرتك في التعليم والتقنية",opts:[{say:"Because I am a teacher myself, with an ijazah in the Quran, and I know these families and their needs.",ar:"لأنني معلم بنفسي، معي إجازة في القرآن، وأعرف هذه الأسر واحتياجاتها.",keys:[["teacher"],["ijazah"]],next:"Credibility is rare. I am interested.",nextAr:"المصداقية نادرة. أنا مهتم."},{say:"I combine education, technology, and years of teaching experience.",ar:"أجمع بين التعليم والتقنية وسنوات من خبرة التدريس.",keys:[["education"],["experience"]],next:"A rare combination. Let us talk next steps.",nextAr:"مزيج نادر. لنتحدث عن الخطوات التالية."}]},{p:"Send me your deck, and let us meet again next week.",pa:"أرسل لي عرضك، ولنجتمع مرة أخرى الأسبوع القادم.",hint:"اشكره وأكّد إرسال العرض اليوم",opts:[{say:"Thank you for your time. I will send the deck today, and I look forward to our next meeting.",ar:"شكرًا لوقتك. سأرسل العرض اليوم، وأتطلع لاجتماعنا القادم.",keys:[["send"],["today"]],next:"Good. I will read it before our meeting.",nextAr:"جيد. سأقرأه قبل اجتماعنا."},{say:"With pleasure. I will send it tonight, God willing.",ar:"بكل سرور. سأرسله الليلة إن شاء الله.",keys:[["send"],["tonight"]],next:"Tonight is perfect. See you next week.",nextAr:"الليلة مثالية. أراك الأسبوع القادم."}]}]},{id:"buddy_islam",icon:"🕌",level:"B1",title:"زائر يسأل عن الإسلام",partner:"James",desc:"زائر فضولي يسألك عن دينك — اشرح بوضوح ولطف.",turns:[{p:"Hello! I am James. I am visiting your city, and I am curious about Islam. Can I ask you some questions?",pa:"مرحبًا! أنا جيمس. أزور مدينتك، وأنا فضولي بشأن الإسلام. هل أستطيع أن أسألك بعض الأسئلة؟",hint:"رحّب به وشجّعه على السؤال",opts:[{say:"Of course, James. You are most welcome. Please ask anything.",ar:"بالطبع يا جيمس. مرحبًا بك جدًا. اسأل أي شيء من فضلك.",keys:[["of course"],["welcome"]],next:"Thank you for your kindness. So, what is Islam in simple words?",nextAr:"شكرًا للطفك. إذن، ما الإسلام بكلمات بسيطة؟"},{say:"Hello, James. I am happy to answer your questions.",ar:"مرحبًا يا جيمس. سعيد بالإجابة على أسئلتك.",keys:[["happy"],["answer"]],next:"Great. First: what does Islam mean, simply?",nextAr:"رائع. أولًا: ماذا يعني الإسلام ببساطة؟"}]},{p:"What is Islam, in simple words?",pa:"ما الإسلام، بكلمات بسيطة؟",hint:"عرّف بالإسلام: إله واحد والنبي محمد ﷺ",opts:[{say:"Islam means submission to God. Muslims believe in one God and follow the teachings of the Prophet Muhammad, peace be upon him.",ar:"الإسلام يعني الاستسلام لله. المسلمون يؤمنون بإله واحد ويتبعون تعاليم النبي محمد صلى الله عليه وسلم.",keys:[["one god"],["muhammad"]],next:"And who is Allah? Is he different from God?",nextAr:"ومن هو الله؟ هل هو مختلف عن God؟"},{say:"Islam is a way of life: belief in one God, prayer, charity, and good manners.",ar:"الإسلام طريقة حياة: إيمان بإله واحد، وصلاة، وصدقة، وأخلاق حسنة.",keys:[["one god"],["prayer"],["charity"]],next:"A way of life — interesting. Who is Allah then?",nextAr:"طريقة حياة — مثير. من هو الله إذن؟"}]},{p:"Who is Allah? Is he different from God?",pa:"من هو الله؟ هل هو مختلف عن God؟",hint:"وضّح أن الله هي الكلمة العربية لـGod الخالق",opts:[{say:"Allah is the Arabic word for God, the one Creator. Arab Christians also use the word Allah for God.",ar:"الله هي الكلمة العربية لـGod، الخالق الواحد. المسيحيون العرب يستخدمون كلمة الله أيضًا.",keys:[["arabic"],["creator"]],next:"I did not know that. What are the five pillars I keep hearing about?",nextAr:"لم أكن أعرف ذلك. ما الأركان الخمسة التي أسمع عنها دائمًا؟"},{say:"Allah is God, the Merciful Creator of everything. We worship Him alone.",ar:"الله هو God، الخالق الرحيم لكل شيء. نعبده وحده.",keys:[["god"],["creator"],["worship"]],next:"Clear. People mention five pillars — what are they?",nextAr:"واضح. يذكر الناس خمسة أركان — ما هي؟"}]},{p:"What are the five pillars of Islam?",pa:"ما أركان الإسلام الخمسة؟",hint:"عدّد الأركان الخمسة",opts:[{say:"They are: the testimony of faith, prayer five times a day, charity, fasting Ramadan, and pilgrimage to Makkah once in a lifetime if you are able.",ar:"هي: الشهادة، والصلاة خمس مرات يوميًا، والزكاة، وصوم رمضان، والحج إلى مكة مرة في العمر إن استطعت.",keys:[["prayer"],["fasting"],["pilgrimage","makkah"]],next:"Five prayers a day — why so many?",nextAr:"خمس صلوات يوميًا — لماذا هذا العدد؟"},{say:"Faith, prayer, giving charity, fasting, and Hajj. They are the foundation of a Muslim's life.",ar:"الإيمان، والصلاة، وإيتاء الزكاة، والصوم، والحج. هي أساس حياة المسلم.",keys:[["prayer"],["fasting"],["foundation"]],next:"A strong foundation. Why pray five times a day though?",nextAr:"أساس قوي. لكن لماذا الصلاة خمس مرات يوميًا؟"}]},{p:"Why do Muslims pray five times a day?",pa:"لماذا يصلي المسلمون خمس مرات يوميًا؟",hint:"اشرح الصلة بالله والسلام والانضباط",opts:[{say:"Prayer connects us to God during the day. It gives peace, discipline, and gratitude.",ar:"الصلاة تصلنا بالله خلال اليوم. تمنح السلام والانضباط والامتنان.",keys:[["connects","connect"],["peace"]],next:"Peace and discipline — I can respect that. And fasting Ramadan?",nextAr:"سلام وانضباط — أستطيع احترام ذلك. وماذا عن صوم رمضان؟"},{say:"It is a direct meeting with our Creator, five times a day. It keeps the heart alive.",ar:"هي لقاء مباشر مع خالقنا، خمس مرات يوميًا. تُبقي القلب حيًا.",keys:[["creator"],["heart"]],next:"Beautifully said. Is fasting only about food?",nextAr:"قُلتَها بجمال. هل الصوم عن الطعام فقط؟"}]},{p:"And fasting Ramadan — is it only about food?",pa:"وصوم رمضان — هل هو عن الطعام فقط؟",hint:"وضّح البعد الروحي: الصبر والشعور بالفقراء",opts:[{say:"No. We fast from food and drink, but also from bad words and actions. It teaches patience and sympathy for the poor.",ar:"لا. نصوم عن الطعام والشراب، وأيضًا عن الكلام والأفعال السيئة. يعلّم الصبر والشعور بالفقراء.",keys:[["food"],["patience"],["poor"]],next:"Deeper than I thought. What is the Quran?",nextAr:"أعمق مما ظننت. ما القرآن؟"},{say:"Fasting trains the soul. We control our desires and remember people who have little.",ar:"الصوم يدرّب الروح. نتحكم في رغباتنا ونتذكر من لديهم القليل.",keys:[["soul","desires"],["remember"]],next:"Training the soul — nice. Tell me about the Quran.",nextAr:"تدريب الروح — جميل. حدّثني عن القرآن."}]},{p:"What is the Quran?",pa:"ما القرآن؟",hint:"عرّف بالقرآن ككتاب الله وهداية",opts:[{say:"The Quran is the holy book of Islam. Muslims believe it is the word of God revealed to the Prophet Muhammad.",ar:"القرآن هو كتاب الإسلام المقدس. يعتقد المسلمون أنه كلام الله أوحي إلى النبي محمد.",keys:[["holy book"],["word of god"]],next:"Revealed — I see. Can anyone visit a mosque?",nextAr:"أوحي — أفهم. هل يستطيع أي شخص زيارة مسجد؟"},{say:"It is our holy book, a guide for life. I memorized it completely, and I teach it to students.",ar:"هو كتابنا المقدس، دليل للحياة. حفظته كاملًا، وأعلّمه للطلاب.",keys:[["holy book"],["memorized","teach"]],next:"You memorized the whole book? Impressive. Can visitors enter a mosque?",nextAr:"حفظت الكتاب كله؟ مذهل. هل يستطيع الزوار دخول مسجد؟"}]},{p:"Can anyone visit a mosque?",pa:"هل يستطيع أي شخص زيارة مسجد؟",hint:"رحّب بالزوار واذكر الاحتشام والترحيب",opts:[{say:"Yes, visitors are welcome in most mosques. Just dress modestly and ask the people there; they will be happy to show you around.",ar:"نعم، الزوار مرحّب بهم في معظم المساجد. فقط ارتدِ ملابس محتشمة واسأل الناس هناك؛ سيسعدون بإرشادك.",keys:[["welcome"],["mosque"]],next:"I would love to visit one day. One last question about kindness.",nextAr:"أود زيارة واحد يومًا ما. سؤال أخير عن اللطف."},{say:"Of course. I can take you to visit our mosque if you like.",ar:"بالطبع. أستطيع أن آخذك لزيارة مسجدنا إن أردت.",keys:[["take you","visit"],["mosque"]],next:"That is very generous. What does Islam teach about kindness?",nextAr:"هذا كرم كبير. ماذا يعلّم الإسلام عن اللطف؟"}]},{p:"What does Islam say about kindness to others?",pa:"ماذا يقول الإسلام عن اللطف مع الآخرين؟",hint:"اذكر حديث خير الناس والرحمة",opts:[{say:"The Prophet taught that the best people are the most useful and kind to others. Kindness is at the heart of our faith.",ar:"علّم النبي أن خير الناس أنفعهم وألطفهم بالآخرين. اللطف في قلب ديننا.",keys:[["kind"],["best people","useful"]],next:"That is a teaching the world needs. Thank you so much.",nextAr:"هذا تعليم يحتاجه العالم. شكرًا جزيلًا."},{say:"Islam commands kindness to parents, neighbours, and even animals. Mercy is our sign.",ar:"الإسلام يأمر باللطف مع الوالدين والجيران وحتى الحيوانات. الرحمة شعارنا.",keys:[["kindness"],["mercy"]],next:"Mercy as a sign — beautiful. I learned a lot today.",nextAr:"الرحمة شعارًا — جميل. تعلمت الكثير اليوم."}]},{p:"Thank you so much. I learned a lot today.",pa:"شكرًا جزيلًا. تعلمت الكثير اليوم.",hint:"اختم بالترحيب والدعاء له أو هدية كتاب",opts:[{say:"You are most welcome, James. May God guide you and bless you. If you have more questions, I am here.",ar:"على الرحب والسعة يا جيمس. هداك الله وبارك فيك. إذا كان لديك أسئلة أخرى، أنا هنا.",keys:[["welcome"],["guide","bless"]],next:"Thank you, my friend. Goodbye for now!",nextAr:"شكرًا يا صديقي. إلى اللقاء الآن!"},{say:"It was my pleasure. Take this small book about Islam as a gift.",ar:"كان من دواعي سروري. خذ هذا الكتاب الصغير عن الإسلام هدية.",keys:[["pleasure"],["gift","book"]],next:"A gift? How kind. Thank you, and goodbye!",nextAr:"هدية؟ يا للكرم. شكرًا، وإلى اللقاء!"}]}]},{id:"buddy_daily",icon:"✈️", <script>
// ===== تثبيت التطبيق (PWA) — شريط «ثبّت التطبيق» =====
(function(){
  var DISMISS_KEY='espInstallDismissed';
  function isStandalone(){
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone===true;
  }
  if(isStandalone()) return;
  try{ if(localStorage.getItem(DISMISS_KEY)==='1') return; }catch(e){}
  var deferred=null, shown=false;
  var bar=document.createElement('div');
  bar.setAttribute('dir','rtl');
  bar.style.cssText='position:fixed;right:0;left:0;bottom:0;z-index:9999;background:#0b3d66;color:#fff;padding:14px 16px;box-shadow:0 -3px 14px rgba(0,0,0,.35);font-family:inherit;';
  bar.innerHTML='<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">'
    +'<span style="font-size:20px;font-weight:bold;flex:1;min-width:200px;">📲 ثبّت «إنجليزي تخصصي» كتطبيق على جهازك</span>'
    +'<button id="espInstallBtn" type="button" style="background:#ffc21f;color:#0b3d66;border:2px solid #ffc21f;font-weight:bold;">تثبيت التطبيق</button>'
    +'<button id="espInstallHelpBtn" type="button" style="background:transparent;color:#fff;border:2px solid #9db8cc;">طريقة التثبيت</button>'
    +'<button id="espInstallClose" type="button" aria-label="إغلاق" style="background:transparent;color:#fff;border:2px solid #9db8cc;padding:8px 14px;">✕</button>'
    +'</div>'
    +'<div id="espInstallHelp" style="display:none;margin-top:10px;background:#ffffff;color:#000;border-radius:10px;padding:12px 14px;font-size:19px;line-height:1.8;">'
    +'<b>على أندرويد (Chrome):</b> افتح قائمة المتصفح ⋮ ثم اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».<br>'
    +'<b>على اللابتوب (Chrome):</b> من قائمة ⋮ اختر «تثبيت إنجليزي تخصصي…» أو اضغط أيقونة التثبيت في شريط العنوان — يعمل بنفس الطريقة تمامًا.<br>'
    +'<b>على آيفون (Safari):</b> زر المشاركة ⬆️ ثم «إضافة إلى الشاشة الرئيسية» (قيود آبل: بلا زر تثبيت تلقائي).'
    +'</div>';
  function show(){ if(shown||isStandalone()) return; shown=true; document.body.appendChild(bar); }
  function hide(permanent){
    if(bar.parentNode) bar.parentNode.removeChild(bar);
    if(permanent){ try{ localStorage.setItem(DISMISS_KEY,'1'); }catch(e){} }
  }
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred=e; show();
    var b=document.getElementById('espInstallBtn'); if(b) b.style.display='';
  });
  window.addEventListener('appinstalled', function(){ hide(true); });
  document.addEventListener('click', function(ev){
    if(ev.target && ev.target.id==='espInstallBtn'){
      if(deferred){
        deferred.prompt();
        deferred.userChoice.then(function(){ deferred=null; hide(false); });
      } else {
        var h=document.getElementById('espInstallHelp'); if(h) h.style.display='block';
      }
    }
    if(ev.target && ev.target.id==='espInstallHelpBtn'){
      var h2=document.getElementById('espInstallHelp'); if(h2) h2.style.display=(h2.style.display==='none'?'block':'none');
    }
    if(ev.target && ev.target.id==='espInstallClose'){ hide(true); }
  });
  // إن لم يصل حدث التثبيت التلقائي (متصفح لا يدعمه)، أظهر الشريط مع شرح الطريقة اليدوية
  setTimeout(function(){ show(); }, 2500);
})();
</script>

function fsGlossWord(w){
  var k=String(w||'').toLowerCase().replace(/[^a-z']/g,'');
  if(!k)return null;
  if(GLOSS[k])return GLOSS[k];
  var tries=[];
  if(/'s$/.test(k))tries.push(k.slice(0,-2));
  if(/ies$/.test(k))tries.push(k.slice(0,-3)+'y');
  if(/es$/.test(k))tries.push(k.slice(0,-2));
  if(/s$/.test(k))tries.push(k.slice(0,-1));
  if(/ing$/.test(k)){tries.push(k.slice(0,-3));tries.push(k.slice(0,-3)+'e');}
  if(/ed$/.test(k)){tries.push(k.slice(0,-2));tries.push(k.slice(0,-1));}
  for(var i=0;i<tries.length;i++){if(GLOSS[tries[i]])return GLOSS[tries[i]];}
  var cache=fsLS('esp2_fsgloss',{}); if(cache[k])return cache[k];
  return null;
}
function fsGlossSentence(en){
  var words=String(en||'').replace(/[^A-Za-z' ]/g,' ').split(/\s+/).filter(Boolean),seen={},out=[];
  words.forEach(function(w){var lw=w.toLowerCase();if(seen[lw])return;seen[lw]=1;var g=fsGlossWord(w);if(g)out.push('<span class="en">'+fsEsc(w)+'</span> = '+fsEsc(g));});
  return out.length?out.join(' · '):'اضغط أي كلمة إنجليزية في النص لترى معناها.';
}
function fsFetchMeaning(w,cb){
  var k=String(w||'').toLowerCase();
  if(typeof fetch!=='function'){cb(null,null);return;}
  fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(k)+'&langpair=en|ar').then(function(r){return r.json();}).then(function(j){
    var t=j&&j.responseData&&j.responseData.translatedText;
    if(t&&!/MYMEMORY|QUERY LENGTH|INVALID/i.test(t)){var c=fsLS('esp2_fsgloss',{});c[k]=t;fsLSset('esp2_fsgloss',c);cb(t,'ترجمة حية');}
    else throw new Error('no');
  }).catch(function(){
    fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(k)).then(function(r){return r.json();}).then(function(j){
      var d=j&&j[0]&&j[0].meanings&&j[0].meanings[0]&&j[0].meanings[0].definitions&&j[0].meanings[0].definitions[0].definition;
      cb(d||null,d?'شرح من القاموس الحي':null);
    }).catch(function(){cb(null,null);});
  });
}

window.fsExplainRepeat=function(){var t=fsCurrentSentence();if(t)fsRepeat(t);};
function fsCheckFeedback(app){
  var fbs=app.querySelectorAll('.fb.bad');
  for(var i=0;i<fbs.length;i++){var fb=fbs[i];if(fb.querySelector('.fs-explain'))continue;var html=fsExplainFor(fb);if(html){var d=document.createElement('div');d.className='fs-explain';d.innerHTML=html;fb.appendChild(d);fsWrapWords(d);}}
}
/* ---- كلمات قابلة للضغط ---- */
var fsWrapping=false;
function fsWrapWords(root){
  if(!root||fsWrapping||typeof document.createTreeWalker!=='function')return;
  fsWrapping=true;
  try{
    var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
      if(!/[A-Za-z]{2,}/.test(n.nodeValue))return NodeFilter.FILTER_REJECT;
      var p=n.parentElement; if(!p)return NodeFilter.FILTER_REJECT;
      if(p.closest('button,.opt,.chip,.built,select,textarea,input,.fs-w,.fs-pop,#exBuilt,#repBar,script,style'))return NodeFilter.FILTER_REJECT;
      if(!p.closest('.en,.line,#fsHintBox,.fs-explain,.fs-first'))return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }});
    var nodes=[]; while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(function(n){
      var frag=document.createDocumentFragment();
      n.nodeValue.split(/([A-Za-z][A-Za-z'’-]*)/g).forEach(function(part){
        if(/^[A-Za-z][A-Za-z'’-]*$/.test(part)&&part.length>=2){var s=document.createElement('span');s.className='fs-w';s.textContent=part;frag.appendChild(s);}
        else frag.appendChild(document.createTextNode(part));
      });
      if(n.parentNode)n.parentNode.replaceChild(frag,n);
    });
  }catch(e){}
  fsWrapping=false;
}
/* ---- حقن في الرئيسية ---- */
function fsEnhanceHome(app){
  try{
    if(app.querySelector('#ladderBox')&&!document.getElementById('fsVoiceBanner')){
      var main=app.querySelector('.desk2-main')||app;
      var d=document.createElement('div'); d.id='fsVoiceBanner'; d.innerHTML=fsVoiceHTML();
      main.insertBefore(d,main.firstChild);
    }
    if(app.querySelector('#ladderBox')&&!document.getElementById('fsFirstCard')){
      var host=app.querySelector('.desk2-main')||app;
      var card=document.createElement('div'); card.id='fsFirstCard'; card.className='card'; card.style.borderColor='#0b7a3e'; card.style.background='#f2fbf5';
      var n=fsDoneCount();
      card.innerHTML='<h3>🌱 خطوات أولى — قبل السلّم</h3><p>'+(fsAllDone()?'✅ أنهيت وحداتك الأولى الأربع — بداية موفقة! السلّم بانتظارك بالأسفل.':'جمل قصيرة جدًا (٢–٤ كلمات) بترتيب: اسمع ← كرر ← العب، وبسرعة أبطأ. أنجزت '+n+' من '+FS_UNITS.length+' وحدات.')+'</p><button type="button" onclick="fsGo()">'+(fsAllDone()?'🔁 راجع خطواتك الأولى':'🌱 ابدأ خطواتك الأولى ←')+'</button>';
      var hs=host.querySelectorAll('h2'),h2=null;
      for(var i=0;i<hs.length;i++){if(hs[i].textContent.indexOf('سلّم')>=0){h2=hs[i];break;}}
      if(h2)host.insertBefore(card,h2);else host.appendChild(card);
    }
    var vs=app.querySelector('.voiceset');
    if(vs&&!document.getElementById('fsAndroidGuide')){
      var det=document.createElement('details'); det.className='fs-guide'; det.id='fsAndroidGuide';
      det.innerHTML='<summary>📱 على أندرويد: صوتك آلي؟ فعّل صوت Google الأصلي مجانًا (دقيقتان)</summary><p style="margin:8px 0">١) افتح <b>إعدادات الهاتف</b> ← «النظام» ← «اللغات والإدخال» ← «تحويل النص إلى كلام» (في سامسونج: الإعدادات ← الإدارة العامة ← تحويل النص إلى كلام).<br>٢) اختر المحرك المفضّل: <b>«خدمات الكلام من Google» (Speech Services by Google)</b>.<br>٣) اضغط ⚙️ بجانبه ← «تثبيت البيانات الصوتية» ← اختر <b>English (United States)</b> أو <b>English (United Kingdom)</b> ونزّل الصوت.<br>٤) ارجع هنا وحدّث الصفحة، ثم اختر صوت Google من قائمة «صوت المتصفح الإنجليزي» بالأعلى وجرّبه.</p>';
      vs.appendChild(det);
    }
  }catch(e){}
}
/* ---- التهيئة ---- */
function fsInit(){
  var app=document.getElementById('app'); if(!app)return;
  var pending=false;
  function run(){pending=false;try{fsEnhanceHome(app);fsInjectHint();fsCheckFeedback(app);fsWrapWords(app);}catch(e){}}
  if(typeof MutationObserver!=='undefined'&&typeof app==='object'){try{var mo=new MutationObserver(function(){if(fsWrapping)return;if(!pending){pending=true;setTimeout(run,60);}});mo.observe(app,{childList:true,subtree:true});}catch(e){}}
  run();
}
try{
  if(typeof document!=='undefined'&&document.getElementById){
    if(document.readyState==='loading'&&typeof document.addEventListener==='function')document.addEventListener('DOMContentLoaded',fsInit);
    else fsInit();
  }
  if(typeof document!=='undefined'&&typeof document.addEventListener==='function'){
    document.addEventListener('click',function(e){
      var w=e.target&&e.target.closest?e.target.closest('.fs-w'):null;
      if(w){e.preventDefault();e.stopPropagation();fsShowWord(w.textContent.trim());}
    },true);
  }
}catch(e){}
window.fsTest={gloss:fsGlossWord,glossSentence:fsGlossSentence,units:FS_UNITS,allDone:fsAllDone,doneCount:fsDoneCount,voiceHTML:fsVoiceHTML,hintHTML:fsHintHTML,lastSpoken:function(){return fsLastSpoken;},markUnit:fsMarkUnit,currentSentence:fsCurrentSentence};
})();
</script>
